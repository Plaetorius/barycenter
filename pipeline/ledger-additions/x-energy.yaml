company: x-energy
name: X-Energy, Inc.
sector: fission
notes: >
  PASS2 gap-fill. Sources: SEC 424B4 (snapshot db86c83f, related-party and use sections not used in pass 1), Wayback copies of three
  x-energy.com releases (ToS-forbidden origin, P2: Wayback only, original_url set) and the Wikipedia article as the independent
  corroboration. WebSearch budget (200/200) was exhausted, so no further independent sources could be searched. Wayback worked
  from this host this time. ADDED: (1) Series C-1 2024 participants named in the Oct 2024 Amazon release (Ken Griffin, Ares affiliates,
  NGP, University of Michigan; no per-investor amounts). The release says "approximately $500 million" while the prospectus says
  $626.5M raised in 2024 (cash C-1 in the existing event); not summed or changed. (2) Series C completion 2023-12-05: additional $80M
  from Ares and Kam Ghaffarian, total Series C $235M including anticipated note conversions; prior investors OPG, Curtiss-Wright, DL E&C,
  Doosan Enerbility. Only the $80M is counted (the $235M is cumulative and overlaps the C-2 note conversions). The $80M has no second
  independent source (Wikipedia corroborates only the $235M total, "raised $235 million ... from existing investors"). (3) C-2 convertible
  notes 2022-23, $113.0M aggregate, $40M OPG, $30M Ares (SEC prospectus); announced_on is a placeholder for "2022 and 2023". They were
  later converted into Series C units (2024-10-11 $98.0M, 2025-09-30 $18.4M), so the Series C $235M and these notes overlap: DO NOT sum
  them. Marked new_money here because the cash arrived as debt; a verifier may prefer to treat as duplicate of the Series C figure.
  (4) Dow agreements: 2022 LOI, 2023 JDA (up to $50M of engineering, up to half ARDP-funded, half Dow), 2025 master project development
  and commercial cooperation agreements; OPG 2022 framework agreement. Day-level dates are placeholders where only the quarter/year is stated.
  NOT ADDED / OBSERVATIONS: Ares Acquisition Corporation SPAC (announced Dec 2022, terminated Oct 2023; Oct 25 2023 release: Dow adds $20M
  convertible preferred PIPE commitment, total Dow $40M, Ares $50M, Ghaffarian about $30M, total PIPE about $100M) never closed, so it is
  not a funding event. IPO underwriters (prospectus and pricing release): joint bookrunning managers J.P. Morgan, Morgan Stanley, Jefferies,
  Moelis & Company (lead joint book-runners), Cantor, UBS Investment Bank, TD Cowen, Guggenheim Securities, Wolfe | Nomura Alliance;
  schema has no underwriter role so they are not participants. No cornerstone investors are named in the prospectus (ARK interest
  was non-binding, already removed). Series A/A-1/B (2018-2021) and Series D investor names: not evidenced by any source I could fetch
  (prospectus gives only carrying values; pre-IPO holders of 5%+ include Ares, Segra, Jane Street as holders, which does not show round participation).
