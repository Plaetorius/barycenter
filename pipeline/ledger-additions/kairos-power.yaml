notes: 'Pass 2 gap-fill. Searched: EDGAR full-text Form D probes for ''Kairos Power'' (0 hits, snapshot ab25f416 / cfa047b2) so private equity rounds and investors remain NOT evidenced; kairospower.com updates (sitemap listed ~95 items; read the state/utility/partner releases) found no funding-round announcement; the 2026-09-02 CFO appointment release says the first CFO will oversee ''corporate fundraising, investor relations'' (no amounts). State support: New Mexico release of 2024-09-16 gives LEDA $3M (NMEDD), JTIP $1.8M and a City of Albuquerque LEDA $500,000 (the city is ''fiscal agent for the state''s funding'', so the city $0.5M may overlap the state LEDA $3M); the release states ''All incentives are pending approval by the Albuquerque City Council'', so all three are recorded as ceiling, not money received. The same release mentions an Industrial Revenue Bond application tied to a ''company investment of more than $269 million'' (company capex, not a financing event). Tennessee release (2021-07-16) names TNECD, Oak Ridge IDB and others as supporters but states no incentive amount. Estimated ''economic impact up to $478 million'' is not funding. Kairos 2021 statement that it would invest $100M is already in the original notes. Agreements added (no values stated): TVA Hermes collaboration 2021, Materion CDA 2022, Los Alamos fuel 2022, Texas A&M-RELLIS siting 2025 (exploratory, 450+ MW), BWXT 2025. Google MPDA and TVA/Google PPA were already recorded. Wikipedia mentions a Feb 2026 $27M ORNL strategic partnership; no primary source was reached, so not recorded. Pages 2019 (GAIN voucher, TCF/NSUF) are bodiless or stated no amount.'
