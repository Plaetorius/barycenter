notes: 'Pass 2 gap-fill: pre-2024 history from the FY2018, FY2019, FY2021, FY2022 and FY2023 10-Ks (all archived from sec.gov/Archives/edgar/data/1084554; filing list from data.sec.gov submissions snapshot 77eb5204). EDGAR Form D full-text for ''Lightbridge'' returns only unrelated issuers (Lightbridge Communications Corp, Lightbridge Holdings LLC), so Lightbridge Corp filed no Form D in the period; its capital raising is S-3/424B5 registered offerings and ATM programmes, sold amounts being those in the 10-Ks. Added the amounts actually sold (net proceeds) per year: 2018 $28.8M (B. Riley FBR), 2019 $3.8M, 2020 $12.3M, 2021 $14.8M, 2022 $11.0M, 2023 $6.4M, plus the Aug 2016 Series A preferred $2.8M to General International Holdings (exchanged for common in Oct 2021 without cash). 2024 onward was already in the ledger. announced_on is the 10-K signature date (the first public statement of the figure), not the sale date; the sales period is the calendar year in the label. The FY2020 and FY2021 amounts both come from the FY2021 10-K (the FY2020 10-K filed 2021-03-25 was not mined). Not recorded: 2010-2017 registered offerings (424B5 listed in EDGAR submissions 2010, 2013, 2014, 2015, 2016, 2017, 2018) - amounts not read; the 2018 424B5s relate to the same B. Riley ATM so would duplicate the $28.8M; Jan 2018 Series A preferred additions; 2017 ATM/equity purchase agreement proceeds ($6.0M in 2017 per FY2018 10-K MD&A, not itemised). Possible overlap: the 2018 $28.8M net proceeds is ''ATM'' only; the FY2018 10-K MD&A says $29.4M including equity purchase agreements.'
