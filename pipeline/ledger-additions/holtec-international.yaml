notes: 'Pass 2 gap-fill, all from the Holtec Nuclear Corporation S-1/A of 2026-09-08 (snapshot 0a61f38e; already archived). All announced_on dates below are the S-1/A date unless the text gives the date, because the filing does not date the underlying events. Searched: EDGAR Form D full-text for ''Holtec'' (0 hits). Holtec is privately held by its founder''s family: the S-1/A Item 15 shows only the Reorganization issuance of Class B shares to Holtec Holdings (465,000,000) and Holtec International Holdco (51,666,667), no investor capital; no private investors or priced rounds exist in the filing. Added: (1) Harbor Associates LP related-party revolver (Oct 2025, $100M, raised to $250M in 2026; the text says $100.0M was fully drawn at 2025-12-31, $125M more drawn in Jan 2026, $50M in July 2026, and ''total amount borrowed as of July 2026 ... $175.0 million'' with availability adjusted to $175.0M; $100M+$125M+$50M exceeds $175M so repayments are implied but not stated, hence the $175.0M figure is a balance/total as worded and may not equal cumulative draws); (2) Mariner Strategic Investments related-party loan (July 2026, up to $150M, $60M drawn); (3) State of Michigan $300M grant for the Palisades restart (the text says Holtec was required to secure it and deposit it in the Restart Account; the S-1/A does not date the award and does not say how much was received) - recorded new_money, reviewer should confirm receipt; (4) DOE Tier 1 First Mover Award, selected Dec 2025, ''expected'' $400M grant subject to a funding agreement: ceiling, not money received. Not recorded: Letter of Credit Facility / 2022 Credit Agreement / 2025 D&D Agreement with BMO (credit lines secured by $450M Harbor collateral; $43.0M outstanding under the D&D agreement at 2026-07-31) - commercial bank credit, amounts not examined; NJEDA $260M tax incentive (Wikipedia only); UK GBP30M. Agreements: Wolverine/Hoosier PPAs, Hyundai E&C teaming. The MVM (Hungary) MOU of Dec 2025 and MELCO/Hyundai MOU (Mar 2026) are mentioned in the S-1/A without terms; only folded into the Hyundai summary.'
