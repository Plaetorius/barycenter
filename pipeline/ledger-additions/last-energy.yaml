notes: 'Pass 2 gap-fill. Searched: EDGAR Form D full-text for ''Last Energy'' finds only two issuer entities ''VI Last Energy SPV I'' (CIK 2062660, Form D 2025-08-07, $1,010,000 sold, 1 investor) and ''VI Last Energy SPV II'' (CIK 2091008, Form D 2025-10-14, $1,155,400 sold, 3 investors), both series of Vineyard Master LLC (a pooled investment fund, Rule 506(b)); the name implies they are investor vehicles holding Last Energy stock, but no filing states the amount invested in Last Energy, so they are NOT recorded as events (possible overlap with the Series C). No Form D by Last Energy Inc. itself was found, so the Series A and the rest of the pre-Series B money ($64M cumulative minus $40M) cannot be sized from filings. Seed: VentureBeat 2020-02-25 (Wayback copy; direct fetch hit HTTP 429) says Last Energy raised $3 million led by First Round Capital (reported). Wikipedia states a ''$20 million Series A led by Gigafund in 2020'' citing PitchBook only; NOT recorded (no primary or press source reached; WebSearch budget exhausted). Note $3M + $20M + $40M = $63M, near the company''s $64M cumulative, consistent but unproven. Series B/C already recorded; lastenergy.com press listing (June 2024 onward) read in full for grants: none beyond the in-kind DOE voucher; South Wales project says ''No Public Funding Required'' (2024-10-15). Agreements added: Romania/RATEN pilot (2022-03, Romania Insider via Wayback; terms unclear, recorded mou), Poland Enea LOI (NucNet 2022-06-28), LSEZ LOI (WNN 2022-07-29), KSSE PPA and 24 UK PPAs (POWER 2023-03-23). Romanian CNCAN pre-authorization completion (2024-10-07) is a regulatory step, not an agreement, and is not recorded. Texas/Haskell: existing agreement kept; no counterparty beyond the site plan found. All PPAs/LOIs are non-funding agreements; capacity for KSSE derived from ''10 20-MWe plants''.'
