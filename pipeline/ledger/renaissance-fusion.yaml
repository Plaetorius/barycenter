  note: "2 corrections: round labels made honest: 'Series A1' is inferred from 'une série A2 pourrait venir compléter' (not stated), and the 2023 round's 'Seed' label is not in the source. Checked: EUR 15M (Jan 2023, Lowercarbon), EUR 10M Bpifrance France 2030 grant, EUR 32M round led by Fonds Révolution Environnementale et Solidaire (Crédit Mutuel) with Lowercarbon; ~EUR 60M is cumulative and not recorded. Gaps: all evidence is trade press (basis reported); 2023 date is a month placeholder."
