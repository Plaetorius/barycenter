notes: >
  All evidence is Le Journal des Entreprises (French trade press, basis=reported); no company release was fetchable
  (renfusion.eu homepage archived but carries no funding text; web search budget exhausted). The 2023 round is only
  dated "janvier 2023" in the article, so announced_on uses 2023-01-01 as a month placeholder. The A1 announced_on is
  the article publication date (2025-03-07); the company release may be a day or so earlier. The article says a
  Series A2 might follow by end 2025: not recorded (no evidence of closing). Amounts for the two investors in A1 are
  not individually disclosed. France 2030 grant is the DGE "Reacteurs nucleaires innovants" tranche of 2023-11-27
  (probe france2030.md); the press reported it in Jan 2024. Do not add the census 62M USD figure: the sum of 15M + 10M
  grant + 32M is not a round. Not recorded: DIFFER/VDL partnership (no date or amount in the snapshot).
  Verifier: "Series A1" is not written in the source; it is inferred from "Une série A2 pourrait venir compléter cette
  opération", so the label now says so. The 2023 round's "Seed" label was also not in the source (relabelled). Amounts and
  participants match the quotes; all evidence remains trade press only (basis reported), no company or Bpifrance primary.
  The "près de 60 millions" (15 + 10 + 32 = 57M EUR) is cumulative incl. grant and correctly not recorded as a round.
verification:
