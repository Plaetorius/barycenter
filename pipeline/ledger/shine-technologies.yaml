notes: 'Built from USAspending spending_by_award search responses (POST, archived with request body in raw/manifest.jsonl,
  source_id usaspending-post). Amount = USAspending ''Award Amount'' (cumulative federal obligation, not a ceiling and not
  an announced figure); disbursed_usd = ''Total Outlays'' when present. Dates = ''Base Obligation Date'' (first obligation),
  else ''Start Date''. Search was recipient-name text on awarding agency = Department of Energy over 2007-10-01..2026-09-30
  and one page of up to 50 rows per award-type group; awards with zero or negative net obligation are omitted. Recipient name
  variants not matched by the name search may be missing. Government record, basis=disclosed. The DELP0000207 row is an LPO
  conditional commitment (USAspending description), not a closed loan; its ''Loan Value'' is the committed face amount and
  must not be counted as funding received. DOE''s announcement was not retrieved. VERIFIER (2026-10-05): every row re-checked
  against the archived search snapshot (amount, outlays, base obligation date all match) and against a per-award USAspending
  award-detail snapshot (api/v2/awards/<id>/, source verify-usaspending). Rows are award-level aggregates, so each event is
  one award, not a modification. Participant evidence now quotes the award''s assistance-listing title or awarding office
  from the award-detail snapshot (the old quote only said ''Department of Energy''); obligated_usd now has its own evidence
  ("total_obligation"). Where the search row showed ''Total Outlays'' 0.0 but the award detail has total_outlay null (no File
  C outlay reporting, typical for pre-2020 or brand-new awards), disbursed_usd was removed: 0.0 meant ''not reported'', not
  ''nothing paid''. DELP0000207: award detail shows total_obligation 0.0, total_loan_value 262,881,867.11 and subsidy cost
  1,359,099.25, consistent with a conditional commitment that has not been disbursed. It is therefore a ceiling. SHINE appears
  in both census files: fission (isotopes/back_end) and fusion (accelerator-driven D-T neutron source). The NNSA DENA awards
  are Mo-99 medical-isotope cooperative agreements with large non-federal cost share.'
verification:
  status: verified
  by: verifier-agent (claude-opus-5-5), 2026-10-05
  'on': '2026-10-05'
  note: '4 changes: DELP0000207 LPO conditional commitment $262.9M changed to amount_kind ceiling with obligated_usd 0 (award
    detail total_obligation 0.0); disbursed 0.0 removed on DENA0002598 and DEAR0002077 (outlays not reported); 6 participant
    evidence items re-sourced; obligated evidence added. Recipient is SHINE Technologies, LLC. SCOPE: SHINE is a fusion-neutron
    isotope producer; ~$117M of NNSA money is Mo-99 isotope work, not energy. Keep it only as adjacent (fusion-enabled isotopes,
    recycling ambitions), flagged, outside nuclear-energy-developer totals. Private rounds (>$1B reported) are not in the
    ledger. Purpose of the LPO loan not confirmed.'
