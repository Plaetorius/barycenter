notes: |-
  Seven SEC Form D filings (CIK 1973276, exemption 506(b); first-sale dates 2023-03-15, 2023-08-02, 2024-03-15, 2024-08-16, 2024-12-04, 2025-05-16, 2026-03-18) are recorded as events (announced_on = the filing's signature date, the first-sale date is kept in round_label; amount = total sold; investor counts 9, 18, 43, 100, 226, 134, 102; no investors named). The 2023 filings state CAD receipts converted to USD ($147,986 CAD at 0.7258; $445,424 CAD at 0.7499). The Jan 2026 round is in EDGAR as a Form D of 2026-01-12 (first sale 2026-01-12, $16,014,029 sold, 88 investors, snapshot 1b332009...) while the company release says $17 Million: the release event below is kept with amount 17M and flagged as a source conflict; the Form D is NOT added as a second event. Form D totals: $57.5M through the Jan 2026 filing (all eight filings: $64.5M, including the Mar 2026 round), versus the release's '$64 Million' total as of 2026-01-13; the gap of about $6.5M is unexplained (earlier non-Form-D funding, or release rounding), so the cumulative event must not be added to the rounds. The 2026-03-30 EDGAR filing is the 2026-03-18 round. Oak Ridge, TN laser uranium-enrichment developer. Jan 2026 round evidenced by a company release on Newsfile. The release headline says the round brings total funding to $64M and is the 'fourth consecutive' oversubscribed round; earlier rounds are taken from the Form Ds above (the release does not list them), so the $64M is recorded as a cumulative statement and must NOT be summed with the round. Investors are unnamed ('a single large, accredited investor', 'returning advanced nuclear technology investors', insiders). The release also says the round was 240% oversubscribed; whether $17M is the closed total or the target is ambiguous in the text (headline says funding round of $17 Million). Not read: later Newsfile releases about a $1.38B planned investment (LIST Island) and a $6.2M facility acquisition, which are not funding.
  MERGE 2026-10-05 (USAspending supplement): LIS holds a DOE LEU Enrichment Acquisition IDIQ task order (USD 0.5M, report on new enrichment capacity), recorded as a gov_contract agreement, not funding.
verification:
  status: verified
  by: merge-verifier-agent (opus), 2026-10-05
  'on': 2026-10-05
  note: 'USAspending merge: the supplement has no funding events; 1 agreement added (LEU IDIQ report task order 89243225FNE400182,
    USD 500,000, 2025-04-11). Nothing skipped. Previous sign-off: verifier-agent (claude-opus-5-5), 2026-10-05: 9 corrections.
    7 Form D events: announced_on moved from first-sale date to the Form D signature date (source date; 2023-03-15 and 2023-08-02
    offerings were both filed 2023-08-22), first-sale date kept in round_label. Release round: closed_on removed (release
    only says ''has closed'' by the announcement date); added the Jan 2026 Form D (sold $16,014,029, signed 2026-01-12) as
    an amount_conflict_form_d evidence item instead of a second event, so the money is counted once at the release figure
    ($17M). Sums checked: Form Ds before Jan 2026 = $41.5M; + $16.0M = $57.5M; + Mar 2026 $7.0M = $64.5M. The release''s ''$64
    Million'' total (as of 2026-01-13) is cumulative-only and is not reconciled ($17M vs $16.0M and $64M vs $57.5M unexplained).
    EDGAR acceptance dates not checked (signature dates used).'
