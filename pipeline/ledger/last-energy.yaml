company: last-energy
name: Last Energy
sector: fission
notes: 'Primary sources: lastenergy.com press releases (all fetched directly). Search quota exhausted, so earlier rounds were
  NOT found: $64M cumulative at Aug 2024 minus the $40M Series B implies about $24M before it (seed/Series A; an aggregator
  mentions a $3M seed and a Feb 2021 Series A, not used because aggregator/no primary). Series C is ''more than $100 million''
  (qualifier over); entrepreneurloop and Built In mirror the release. Haskell County capacity_mw 600 = 30 x 20 MWe (derived
  from the release''s plan of 30 microreactors and 20 MWe unit size); plan only, no counterparty. Census cumulative 314M for
  Last Energy not verified. No public cash grant found: DOE Clean Technology Accelerator is an in-kind voucher (no amount),
  Reactor Pilot Program is authorization plus an OTA with no stated dollar value, EXIM is a non-binding LOI for debt. Last
  Energy''s Wales project states ''No Public Funding Required''. Slugs doe-ott, exim, dp-world, texas-a-m-university-system,
  haskell-county-site are proposed (not in public-funders.csv).

  [pass2] Pass 2 gap-fill. Searched: EDGAR Form D full-text for ''Last Energy'' finds only two issuer entities ''VI Last Energy
  SPV I'' (CIK 2062660, Form D 2025-08-07, $1,010,000 sold, 1 investor) and ''VI Last Energy SPV II'' (CIK 2091008, Form D
  2025-10-14, $1,155,400 sold, 3 investors), both series of Vineyard Master LLC (a pooled investment fund, Rule 506(b)); the
  name implies they are investor vehicles holding Last Energy stock, but no filing states the amount invested in Last Energy,
  so they are NOT recorded as events (possible overlap with the Series C). No Form D by Last Energy Inc. itself was found,
  so the Series A and the rest of the pre-Series B money ($64M cumulative minus $40M) cannot be sized from filings. Seed:
  VentureBeat 2020-02-25 (Wayback copy; direct fetch hit HTTP 429) says Last Energy raised $3 million led by First Round Capital
  (reported). Wikipedia states a ''$20 million Series A led by Gigafund in 2020'' citing PitchBook only; NOT recorded (no
  primary or press source reached; WebSearch budget exhausted). Note $3M + $20M + $40M = $63M, near the company''s $64M cumulative,
  consistent but unproven. Series B/C already recorded; lastenergy.com press listing (June 2024 onward) read in full for grants:
  none beyond the in-kind DOE voucher; South Wales project says ''No Public Funding Required'' (2024-10-15). Agreements added:
  Romania/RATEN pilot (2022-03, Romania Insider via Wayback; terms unclear, recorded mou), Poland Enea LOI (NucNet 2022-06-28),
  LSEZ LOI (WNN 2022-07-29), KSSE PPA and 24 UK PPAs (POWER 2023-03-23). Romanian CNCAN pre-authorization completion (2024-10-07)
  is a regulatory step, not an agreement, and is not recorded. Texas/Haskell: existing agreement kept; no counterparty beyond
  the site plan found. All PPAs/LOIs are non-funding agreements; capacity for KSSE derived from ''10 20-MWe plants''.'
