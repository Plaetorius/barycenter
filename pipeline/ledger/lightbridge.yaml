  actually sold (from FY2025 10-K, snapshot 9d7cc820...): Stifel ATM net proceeds $21.4M in 2024 and $36.4M in 2025
  (agreement terminated 2025-05-30); Jefferies ATM net proceeds $139.6M in 2025 (gross about $144.4M); total 2025 ATM net
  $176.0M; $142.1M remained available under the November 2025 prospectus supplement; Jan 1 to Feb 26 2026 net $10.9M.
  The Sep 2025 supplement added up to $75,000,000 and a Nov 2025 supplement (S-3ASR filed 2025-11-28) followed; these are
  all the Jefferies programme and not archived as separate events. Not covered: pre-2019 history (2010-2018 424B5
  offerings listed in EDGAR submissions), DOE GAIN vouchers, any 2026 filings beyond Sept. The Battelle/INL agreements are
  cost-reimbursement arrangements where Lightbridge pays Battelle, recorded as agreements only, not funding. The Feb 2025
  Series X preferred ($100) was a voting device, not funding.
