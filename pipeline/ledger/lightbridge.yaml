notes: >-
  [Verifier 2026-10-05] Both ATM programme events set to amount_kind ceiling (programme maximums, not money received; the Jefferies programme was raised to $75M + $75M (Sep 2025) + $150M (Nov 2025) = $300M of capacity). The amounts actually sold, stated in the FY2025 10-K filed 2026-02-26, are now separate new_money events (net proceeds): Stifel FY2024 $21.4M, Stifel 2025 $36.4M, Jefferies 2025 $139.6M, Jefferies 2026-01-01 to 02-26 $10.9M. Stifel sales before 2024 (2019-2023) are not recorded (earlier 10-Ks not read).
