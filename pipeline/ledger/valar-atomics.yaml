notes: 'Search quota exhausted; sources were found by following links from fetched pages. Event dating: TechCrunch/Bloomberg report the Series B on 2026-08-03, the company post is dated August 4, 2026 (event uses 08-03, credit facility uses the company date). OVERLAP WARNING: TechCrunch (2026-07-17, snapshot in raw) says part of the $1B was raised earlier; Bloomberg 2026-03-31 reported $450M ($340M equity + $110M debt) at a $2B valuation, so the March tranche may be INCLUDED in the $1B Series B; do not sum without review. The March items are Bloomberg paywall headline/lede only (reported). Series A $130M: Bloomberg lede plus the company library headline ''Valar Atomics Announces $130M Series A''; the original Series A release was not reachable, so investors beyond Luckey/Sankar are not recorded. Valar uses TRISO fuel; DOE Reactor Pilot Program selection has no amount (authorization pathway). Reported 2026 pilot criticality is not funding. No SBIR/ARPA-E/USAspending money found in the probes (not searched specifically). Census figures ($1B equity plus $200M credit facility) match. VERIFIER (2026-10-05): the March 2026 $340M equity and $110M debt are marked duplicate of the $1B Series B because TechCrunch (2026-07-17) says that $450M is part of the $1B round capital; the debt part may instead sit outside the $1B (or inside the $200M facility), so it is excluded either way pending a primary source. The $200M credit facility is a ceiling (no drawn amount stated). Series A leads (Snowpoint, Day One, Dream) and John Donovan added from the CNBC snapshot.'
