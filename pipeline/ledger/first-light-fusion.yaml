company: first-light-fusion
name: First Light Fusion
sector: fusion
notes: "WebSearch budget was exhausted, so evidence is limited to the company's own newsroom (WordPress feed, 20 pages crawled), UKAEA, Companies House filing-history HTML and EPSRC/BEIS mentions inside releases. NOT FOUND in archivable primary sources: the 2021-2022 Series B (widely reported as about USD 45M, led by Tencent; unverified here and deliberately not recorded), any Innovate UK / UKRI Gateway-to-Research per-project amounts (probe ukri.md lists 18 projects incl. GBP 6.14M EPSRC IFE grant EP/X025373/1 which is a university-led project total, not recorded as company funding), any EU/CORDIS or EIB/EIC award, German or SPRIND money (none applicable). UKAEA Fusion Industry Programme contracts are recorded without amounts because the GBP 8.1M total is split across 14 organisations with no per-organisation figure. The 2026 round is a FIRST CLOSE of a larger round; the final size is not announced. Companies House shows SH01 allotments dated 17 April 2026 (filed 22 May and 9 July 2026). The Dec 2020 release gives no round label. Seed (2011) date is month-level only (July 2011).\n VERIFIER (2026-10-05): REMOVED the event first-light-fusion-epsrc-prosperity-2023 (GBP 6M EPSRC Prosperity Partnership, company release 2023-05-22). The UKRI Gateway to Research record (EP/X025373/1, snapshot 77fe6e85bf99) is the same partnership: fund valuePounds 6141929, leadResearchOrganisation IMPERIAL COLLEGE LONDON, with Oxford and York, and First Light Fusion as the industry partner that match-funds. The grant is paid to the universities, so under the lab/university money policy (D5) and the different-recipient rule it is not company funding; it can appear as funder-page context or as a partnership. UKAEA Fusion Industry Programme and simulation awards are procurement contracts recorded as grant without amounts; reclassify if amounts are found. Seed day (2011-07-01) is a placeholder for July 2011."
verification:
  status: verified
  by: verifier-agent (claude-opus-5-5), 2026-10-05
  'on': '2026-10-05'
  note: '1 correction: EPSRC Prosperity Partnership GBP 6M event removed (UKRI GtR shows Imperial College London as grant holder, GBP 6,141,929; First Light is the match-funding partner). All other amounts, dates and participants match their company-release quotes (USD 25M Dec 2020 led by OSI; GBP 25M first close Apr 2026 led by East X Ventures/Starmaker One with UKAEA, IP Group, Hostplus; SH01 allotment 17 Apr 2026). Not confirmed: 2021-22 Series B (about USD 45M, Tencent-led per press) has no archived primary source; final size of the 2026 round; per-company UKAEA contract values.'
