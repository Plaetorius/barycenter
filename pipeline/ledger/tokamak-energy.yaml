company: tokamak-energy
name: Tokamak Energy Ltd
sector: fusion
notes: >-
  Built from archived company releases, USAspending, UKRI Gateway to Research (GtR) XML API and UKAEA releases.
  GAPS: pre-2024 private rounds (2013-2023) could not be evidenced from robots-permitted primary sources in this pass
  (WebSearch budget exhausted; the company site sitemap lists no pre-2022 funding releases); the Nov 2024 release states
  only the cumulative $275M private / $60M government total. Companies House SH01 allotments exist (probe companies-house.md,
  Tokamak 07054929) but amounts were not extracted. The release gives no round label (FIA/press call it Series C; not asserted).
  Cumulative event tok-cumulative-2024 must NOT be counted as a round. DOE Milestone figure: USAspending shows $7.5M total
  obligation to TOKAMAK ENERGY INC from DOE in FY19-26 (recipient search, not filtered by programme); public-money.md attributes
  it to the Milestone programme (7.5M obligated / 3.0M outlaid in that probe), so treat as Milestone-linked, to be reconciled with the
  DOE announcement (not archived at a working URL: energy.gov guessed URLs returned 404). Nine INFUSE vouchers (2019-2024; releases state counts,
  no amounts) and the Oct 2025 FIRE collaborative (University of Houston-led, no Tokamak amount) are not recorded as funded events
  because no amount is disclosed. The $52M ST40 upgrade is a joint DOE/DESNZ/Tokamak sponsorship total (recorded as agreement, not
  funding); DOE grant DESC0025884 ($7.25M, LEAPS) is likely the DOE slice of it - do not sum. UKRI: only lead-organisation Innovate UK
  grants are recorded; 2023-25 Innovate UK partner projects have project totals only (no Tokamak share) and are omitted. UKAEA FIP/LIBRTI
  awards to Tokamak have no per-organisation amount. No EIB/EIC/CORDIS/German public funding found for this company. Debt: none found. VERIFIER (2026-10-05): the Milestone amount is now tied to award-level USAspending record DESC0024889
  (TOKAMAK ENERGY INC, US subsidiary; "ST-E1 PRELIMINARY DESIGN REVIEW FOR A FUSION PILOT PLANT", $7.5M award, $3.0M outlays,
  start 2024-06-05) instead of only the recipient-level DOE total; announced_on stays the 2023-05-31 selection date. GtR also lists
  separate organisation records "Tokamak Solutions", "Tokamak Energy" and "Tokamak Energy (United Kingdom)" whose projects were
  not checked (possible further Innovate UK grants).
