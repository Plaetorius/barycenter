company: kairos-power
name: Kairos Power LLC
sector: fission
notes: 'Private; no equity round, Form D or financing release found (EDGAR full-text probes for "Kairos Power" return no Form
  D; kairospower.com newsroom has no round announcements; see docs/survey/probes/newsrooms.md). Lifetime equity raised is
  therefore NOT evidenced and left out. The only investor-side event is the Samsung C&T binding term sheet (2026-09-21, up
  to $100M, part in-kind engineering services). DISCREPANCY KEPT OPEN (do not merge): DOE announcements state a DOE share
  of up to $303M (total award value $629M over seven years) for the ARDP Risk Reduction / Hermes award, while USAspending
  award DENE0009325 (recipient KAIROS POWER LLC, type 11 technology investment agreement, signed 2024-02-12) shows a total
  obligation of $135.0M, $126.858M account outlays and $0 non-federal funding. The two are recorded as separate events (ardp-doe-announced-2020,
  ardp-doe-tia-2024, ardp-usaspending-obligated) sharing round_group ardp-risk-reduction-hermes so a reconciler can see they
  concern the same programme; they must not be summed. VERIFIER (2026-10-05): only the USAspending obligation ($135M, of which
  $126.858M outlaid) counts as new_money; the 2024 TIA "up to $303M" is the milestone ceiling (amount_kind ceiling) and the
  2020 selection announcement of the same $303M DOE share is a duplicate of the TIA. Plausible explanation (NOT evidenced):
  USAspending obligates milestone tranches incrementally, so obligated < ceiling. USAspending recipient total for DOE FY20-26
  is $135.5M (snapshot 243d1e1f). Small items not made into events: GAIN voucher (2019, no amount), NSUF/TCF awards 2019 (project
  value ~$50M is a facility project, not Kairos money), SBA loan 4181827109 $3.3M 2020 (apparently pandemic loan, not evidenced
  here), University of Wisconsin pass-through DEAR0001293 $0.8M. Hermes 1 HALEU supply contract with DOE (2026-01-20) has
  no stated value. Kairos stated in 2021 it would itself invest $100M in the Oak Ridge demonstration (state release) - not
  a funding event. Westinghouse+Kairos "$18mn of SMR funding" (2019-04-03) page has no body text in the snapshot, so not used.
  NOTE doe-industry-opportunities-2020: announced_on is the USAspending award start date, not a press date. NOTE samsung-ct-strategic-investment-2026:
  up to $100M is ''a combination of direct investment and in-kind engineering services, subject to regulatory approvals'';
  cash/in-kind split undisclosed so amount may overstate new cash; term sheet, not a closed round.


  [pass2] Pass 2 gap-fill. Searched: EDGAR full-text Form D probes for ''Kairos Power'' (0 hits, snapshot ab25f416 / cfa047b2)
  so private equity rounds and investors remain NOT evidenced; kairospower.com updates (sitemap listed ~95 items; read the
  state/utility/partner releases) found no funding-round announcement; the 2026-09-02 CFO appointment release says the first
  CFO will oversee ''corporate fundraising, investor relations'' (no amounts). State support: New Mexico release of 2024-09-16
  gives LEDA $3M (NMEDD), JTIP $1.8M and a City of Albuquerque LEDA $500,000 (the city is ''fiscal agent for the state''s
  funding'', so the city $0.5M may overlap the state LEDA $3M); the release states ''All incentives are pending approval by
  the Albuquerque City Council'', so all three are recorded as ceiling, not money received. The same release mentions an Industrial
  Revenue Bond application tied to a ''company investment of more than $269 million'' (company capex, not a financing event).
  Tennessee release (2021-07-16) names TNECD, Oak Ridge IDB and others as supporters but states no incentive amount. Estimated
  ''economic impact up to $478 million'' is not funding. Kairos 2021 statement that it would invest $100M is already in the
  original notes. Agreements added (no values stated): TVA Hermes collaboration 2021, Materion CDA 2022, Los Alamos fuel 2022,
  Texas A&M-RELLIS siting 2025 (exploratory, 450+ MW), BWXT 2025. Google MPDA and TVA/Google PPA were already recorded. Wikipedia
  mentions a Feb 2026 $27M ORNL strategic partnership; no primary source was reached, so not recorded. Pages 2019 (GAIN voucher,
  TCF/NSUF) are bodiless or stated no amount.'
