notes: |-
  GLE is the Silex Systems (ASX: SLX, majority) / Cameco joint venture commercialising SILEX laser enrichment at the planned Paducah Laser Enrichment Facility (PLEF). A separate silex-systems ledger was NOT written: Silex's own equity raisings could not be evidenced (silex.com.au announcement lists are JS-rendered; the ASX markit API returns only the 5 latest items; WebSearch budget exhausted), and the DOE award below accrues to GLE, so recording it under Silex too would double count. Funding of GLE by its owners (Silex/Cameco/Westinghouse equity or loans) was not found. Conflict: DOE says it 'awarded an additional $28 million'; the Silex-oriented article (smallcaps.com.au) says 'up to $28 million' under the DOE Innovative Technology Award; amount recorded as exact per the DOE release, flagged for review. The Kentucky package is performance-based tax and other incentives (preliminary approval), recorded as an up_to 'other' event, not cash. GLE and Cameco offtake (ASX headline 2026-09-14 AEST) is evidenced only by the headline in the ASX API snapshot; terms unread. Verifier: the Kentucky package (preliminary approval, performance-based tax and other incentives "up to $98.9 million" if thresholds are met) is a maximum, not money received: now amount_kind=ceiling. The DOE $28M stays exact/new_money on the DOE release wording ("awarded an additional $28 million"); no obligation or outlay was checked in USAspending, and the press "up to" wording means it may be paid on a cost-share reimbursement basis.
  MERGE 2026-10-05 (USAspending supplement): the DOE USD 28M award is DE-NE0009559 in USAspending, recipient GLOBAL LASER ENRICHMENT LLC (the company itself), obligated USD 28.44M, so it is paid on obligation, not a ceiling.
