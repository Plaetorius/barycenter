notes: >-
  Little evidenced. Gauss Fusion is an industry-consortium GmbH (founders Alcen, ASG Superconductors, Bruker EAS, IDOM,
  RI Research Instruments); the only funding amount found in a robots-permitted primary source is the EUR 8M founders'
  pre-seed (Feb 2023, Bruker release). The census lists a "Grant 2024-04" and "EUR17M known" with no archivable source
  found in this pass; not recorded. The Bruker release does not give per-founder amounts or say which founders put in the
  EUR 8M, so the five founding companies are listed as participants on the strength of "founders' pre-seed financing"
  (reviewer: confirm). BMFTR Fusion Hub STRIDE (coordinated by Proxima Fusion, Gauss Fusion and Max Planck IPP) is funded from
  a EUR 125M first round across three hubs; Gauss's share is undisclosed so no amount is recorded. Not found in CORDIS
  (no HE/H2020 hits per probe); no Foerderkatalog access (403); no Gauss-specific EIB/EIC record found. WebSearch budget exhausted.
  Verifier: the STRIDE announced_on evidence quoted the coordinator sentence, which carries no date; replaced with the
  BMFTR page date ("Meldung 29.07.2026") and kept the coordinator sentence as recipient evidence. The page says the three
  hubs will "soon" connect and BMFTR provides "initially" EUR 125M across them, so Gauss's share is unknown and may not yet
  be obligated. Founders' pre-seed participants: the release lists the five founding companies but does not state that
  each contributed to the EUR 8M; kept on the strength of "founders' pre-seed", residual doubt.
