company: niowave
name: Niowave
sector: fission
notes: 'Built from USAspending spending_by_award search responses (POST, archived with request body in raw/manifest.jsonl,
  source_id usaspending-post). Amount = USAspending ''Award Amount'' (cumulative federal obligation, not a ceiling and not
  an announced figure); disbursed_usd = ''Total Outlays'' when present. Dates = ''Base Obligation Date'' (first obligation),
  else ''Start Date''. Search was recipient-name text on awarding agency = Department of Energy over 2007-10-01..2026-09-30
  and one page of up to 50 rows per award-type group; awards with zero or negative net obligation are omitted. Recipient name
  variants not matched by the name search may be missing. Government record, basis=disclosed. VERIFIER (2026-10-05): every
  row re-checked against the archived search snapshot (amount, outlays, base obligation date all match) and against a per-award
  USAspending award-detail snapshot (api/v2/awards/<id>/, source verify-usaspending). Rows are award-level aggregates, so
  each event is one award, not a modification. Participant evidence now quotes the award''s assistance-listing title or awarding
  office from the award-detail snapshot (the old quote only said ''Department of Energy''); obligated_usd now has its own
  evidence ("total_obligation"). Where the search row showed ''Total Outlays'' 0.0 but the award detail has total_outlay null
  (no File C outlay reporting, typical for pre-2020 or brand-new awards), disbursed_usd was removed: 0.0 meant ''not reported'',
  not ''nothing paid''. Three awards appear twice under old and new DOE ID formats (FG02-07ER84861/DEFG0207ER84861, FG02-08ER85172/DEFG0208ER85172,
  FG02-08ER85014/DEFG0208ER85014). The legacy totals look like Phase I plus the later Phase II obligations (e.g. 850K = 100K
  + 750K), so the new-format rows are marked duplicate. SCOPE: Niowave is a superconducting-accelerator and medical-isotope
  company. Most of its 31 Office of Science SBIR/STTR awards are accelerator hardware for DOE science facilities (SRF cavities,
  crab cavities for LHC/RHIC, electron guns), not nuclear energy. Only DESC0011355, DESC0017733, DESC0018544, DESC0018691
  and DESC0020857 (fast-neutron irradiation, subcritical fuel testbed, lead-bismuth corrosion, advanced fast-reactor fuels)
  relate to nuclear energy; the NNSA DENA awards are Mo-99 isotope production.'
verification:
  status: verified
  by: verifier-agent (claude-opus-5-5), 2026-10-05
  'on': '2026-10-05'
  note: '37 changes: 3 new-format rows marked duplicate (same award as the legacy FG02 row); 35 participant evidence items
    re-sourced; obligated evidence added; disbursed 0.0 removed on 3 awards whose outlays were never reported. Recipient is
    Niowave, Inc. throughout. SCOPE: evidence is right, but Niowave is an isotope/accelerator company. I recommend excluding
    it from a nuclear-energy funding map, or keeping it only in an isotopes/fuel-cycle layer with just the 5 reactor-related
    SBIRs. The ~$40M+ of accelerator SBIRs must not count as nuclear-energy funding.'
