notes: >-
  Form D (Elementl Power Inc., CIK 2021861, filed 2024-02-20, signed 2024-02-20): $5,000,015 sold to 3 investors, first sale
  2023-12-13, total offering 'Indefinite'; announced_on is the first-sale date; round label and investors are not in the
  filing. A separate Form D (AVSF - Elementl Power 2025, LLC, CIK 2105158, first sale 2026-01-08, $1,549,500 from 84
  investors, 'Pooled Investment Fund') is an Alumni Ventures vehicle named after Elementl; it is not recorded as an event
  because the amount invested into Elementl is not stated (snapshot 52e00ff4...); do not add it to the Elementl total.
  Advanced-nuclear project developer / independent power producer (founded 2022). The only dated equity amount is the Form D above;
  no labelled round was found. The homepage (snapshot 8bbd39b2...) lists backers 'Energy Impact Partners, T. Rowe Price, Prelude Ventures,
  Breakwater North, and Alumni Ventures' without round, date or amount, so they are not attached as participants. Google's early-stage development capital commitment (2025-05-07) has an undisclosed amount. The CNBC
  headline 'Google to fund development of three Elementl nuclear sites' is on the company newsroom list only. Also
  listed but not read: ORNL siting partnership (2025-05-22), Ohio 1.5 GW BWRX-300 project with GE Vernova Hitachi
  (2026-06-18). The Google release says each project would generate at least 600 MW, hence capacity 1,800 MW (three
  sites), matching the newsroom's '1,800 megawatts'. WebSearch budget was exhausted.
