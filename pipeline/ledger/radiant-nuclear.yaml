notes: "Radiant Industries, Inc. (SEC CIK 1914078), Kaleidos 1 MWe microreactor, El Segundo CA. Census slug radiant-nuclear.\
  \ POLICY P2: radiantnuclear.com is ToS-forbidden. Wayback copies were tried (web.archive.org/web/2/ for series-d-announcement\
  \ and series-b returned 404; series-c-close, /news and the availability API refused connections or returned 429), so NO\
  \ radiantnuclear.com evidence is cited. Pre-policy probe snapshots of radiantnuclear.com (072c5b0f991a, 5d85cdd2e8a9, 62dbbd3d7344)\
  \ are deliberately not used. Every amount rests on independent sources (SEC Form D, Orrick, SiliconANGLE, DCVC, USV, USAspending).\
  \ WebSearch budget was exhausted and Exa was rate limited, so discovery was limited to URLs already known. GAPS: seed rounds\
  \ (2020-2021, aggregator-only figures of $1.2M and $6M, not recorded); Series B and the Series C extension have no company/investor\
  \ release in evidence (company page forbidden); Series D participants beyond the two leads are unnamed (\"current investors\"\
  ); DOE HALEU allocation and NRIC DOME support are not evidenced here (no fetched primary page) and carry no amounts; the\
  \ DOE Reactor Pilot Program states no federal money. CONFLICTS: (1) Series A: USV says USV Climate Fund led a \"$10mm round\"\
  ; Form D total sold is $12.62M (aggregator says $13M); ledger uses the Form D figure. (2) Series C: DCVC says $100M; Form\
  \ D (2024-11-15) $100.0M; the aggregator startupintros shows $170M, which appears to combine the Nov 2024 round with the\
  \ 2025 Form D tranche ($66.0M, signed 2025-06-10). (3) Series D: Orrick/SiliconANGLE say \"more than $300 million\"; the\
  \ Form D filed 2025-12-29 shows $268.8M sold of $350.0M offered (first sale 2025-12-15), probably a partial-close snapshot.\
  \ Ledger records \">$300M\" and does not add the Form D total. The 2025-06-10 event (radiant-series-c-extension-2025) is\
  \ an SEC Form D (first sale 2025-02-13) with no round label in the filing and no investor names; it is likely the Series\
  \ C close/extension but that is unverified (company page forbidden). Participant lists for Series B and Series C come from\
  \ startupintros.com (aggregator, basis reported, single source, may be incomplete or imperfect); review before publishing.\
  \ Decisive Point-Radiant Industries I/II SPVs (CIK 2030456, 2126203; II sold $7.85M, filed 2026-06-24) are investor vehicles,\
  \ not Radiant rounds, and are not recorded as events. Form D amounts are totals sold, not necessarily new in a single announced\
  \ round. Form D signature date is used as announced_on where no release was fetched.\n VERIFIER (2026-10-05): removed 12\
  \ participants that rested only on the startupintros.com aggregator (Series B: Andreessen Horowitz, Founders Fund, Alumni\
  \ Ventures, Lux Capital, Initialized Capital; Series C: Chevron Technology Ventures, Andreessen Horowitz, Founders Fund,\
  \ Union Square Ventures, Draper Associates, Boost VC, Decisive Point). The aggregator Series C page merges the Nov 2024\
  \ round with the 2025 tranche ($170M) and appears to mix in later (Series D era) investors, so it cannot place an investor\
  \ in a round; these names are leads for a future pass with a primary or investor source. Series C amount now also carries\
  \ the Form D (signed 2024-11-15, $99,999,999 sold, first sale 2024-10-23). The $66.0M 2025 Form D (first sale 2025-02-13)\
  \ is consistent with a Series C second close (SiliconANGLE: Series D came \"six months after its Series C\") and is a separate\
  \ offering, not a duplicate of the $100M.\n[pass2] PASS2. Searched: existing evidence re-read; WebSearch budget was exhausted\
  \ so discovery was limited to links on archived pages. Added the Jan 2026 Series D upsizing (Axios Pro preview, $300M to\
  \ $350M; duplicate of radiant-series-d-2025, kept visible only) and the $2.2B Army award headline (NYT page is JS-blocked;\
  \ evidence is the headline as listed on the DCVC company page; likely the same programme as the $750M Radiant share already\
  \ recorded, so not additive). NOT FOUND: primary evidence naming Series B/C/D investors (company pages forbidden by P2;\
  \ Series C-close and Series B blog pages not obtainable), Radiant seed rounds, DOE HALEU/NRIC amounts. Form D Series D total\
  \ ($268.8M sold of $350M) is consistent with the $350M headline."
