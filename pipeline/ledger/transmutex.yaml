notes: 'Built from USAspending spending_by_award search responses (POST, archived with request body in raw/manifest.jsonl,
  source_id usaspending-post). Amount = USAspending ''Award Amount'' (cumulative federal obligation, not a ceiling and not
  an announced figure); disbursed_usd = ''Total Outlays'' when present. Dates = ''Base Obligation Date'' (first obligation),
  else ''Start Date''. Search was recipient-name text on awarding agency = Department of Energy over 2007-10-01..2026-09-30
  and one page of up to 50 rows per award-type group; awards with zero or negative net obligation are omitted. Recipient name
  variants not matched by the name search may be missing. Government record, basis=disclosed. VERIFIER (2026-10-05): every
  row re-checked against the archived search snapshot (amount, outlays, base obligation date all match) and against a per-award
  USAspending award-detail snapshot (api/v2/awards/<id>/, source verify-usaspending). Rows are award-level aggregates, so
  each event is one award, not a modification. Participant evidence now quotes the award''s assistance-listing title or awarding
  office from the award-detail snapshot (the old quote only said ''Department of Energy''); obligated_usd now has its own
  evidence ("total_obligation"). Where the search row showed ''Total Outlays'' 0.0 but the award detail has total_outlay null
  (no File C outlay reporting, typical for pre-2020 or brand-new awards), disbursed_usd was removed: 0.0 meant ''not reported'',
  not ''nothing paid''. Recipient is TRANSMUTEX U.S.A., INC. (the US subsidiary of Swiss Transmutex SA), not the Swiss parent.
  Award detail: ARPA-E NEWTON (DE-FOA-0003418), $2.81M obligated, $2.17M non-federal cost share, performance period 2027-01-01
  to 2029-12-31, no outlays yet. Los Alamos National Laboratory and University of Maryland are partners; per D5, any lab work
  is funded outside this award and is not company money.'
