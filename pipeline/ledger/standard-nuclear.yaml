notes: 'Public company (NYSE: STDN, CIK 0002086716). Financing facts come from the S-1/424B4 (SEC, disclosed) and the company news index; Bloomberg 2026-01-26 (reported) supplies the Series A lead and investor names because Business Wire releases return 403 (not used). CONFLICTS and double-count guards: (1) the company/Bloomberg headline is a $140M Series A (Jan 2026); the prospectus splits it into Series A $70.0M (agreement 2025-08-14) and Series A-2 $70.0M (2026-01-23). The two SEC closings are the new_money events; the $140M headline is kept as amount_kind cumulative (not additive). The investor names (Decisive Point lead; Chevron Technology Ventures, StepStone new; a16z existing) are attached to the A-2 event but Bloomberg attributes them to the whole $140M round, so who invested in the 2025-08 closing is not separately evidenced. (2) The ''$42 Million'' emergence-from-stealth announcement (2025-06-11) is kept as cumulative: the S-1 shows $33.5M SAFE notes (2024, converted into Series Seed-1 at $0.50) plus a $10.0M Series Seed (2025-02-13), and one investor''s $1.0M was refunded; the SEC events are not summed with the $42M. SAFE event is dated at year end (2024) because the S-1 gives no date. Seed investors are not named. IPO: priced 2026-07-15 at $15.00 (10,000,000 shares, $150,000,000 gross; underwriter option 1,500,000 shares), after the S-1 range of $18-21 for 18.3M shares (about $356M) reported by valueaddvc (secondary, not used); the final prospectus supersedes. Over-allotment exercise not verified. USNC asset purchase (Chapter 11 363 sale): S-1 states total cash purchase price $32.9M at closing (agreement dated 2024-11-21) versus $28M in press; this is an acquisition of assets, not funding, and is not recorded as an event. Public money: no cash grants found; the DOE Other Transaction Agreement (Fuel Production Line Authorization, dated 2025-09-26, announced 2025-12-11), Fuel Line Pilot Program (2025-08-05), HALEU conditional commitment and Surplus Plutonium Utilization Program selection carry no stated dollar amounts. Form D filings of 2026-02-09 (3, by the issuer) exist on EDGAR but were not archived. Oklo alliance agreement is from the news index title only. Proposed slugs: framatome, oklo, radiant (check against investors/companies lists). VERIFIER (2026-10-05): the Series A investors are now attached to the $140M headline event (round_group standard-nuclear-series-a), not to the A-2 closing, because the company release (Business Wire via Wayback) names them for the whole $140M; 5 investors added from that release (XTX Ventures, Welara, Fundomo, Washington Harbour Partners, Crucible Capital). The $70M + $70M SEC closings remain the counted events; the $140M stays cumulative (not additive). IPO closed 2026-07-17 (8-K filed 2026-07-21); over-allotment exercise still unverified (no 10-Q archived). The $18-21 S-1 price range is from a secondary blog and unverified.'
verification:
  status: verified
  by: verifier-agent (claude-opus-5-5), 2026-10-05
  'on': '2026-10-05'
  note: '4 corrections: Series A participants moved from the A-2 closing to the $140M headline event (company release names them for the whole round) with primary evidence; 5 participants added from the release; $140M headline gains primary amount evidence; IPO closed_on 2026-07-17 added from the 8-K. Amounts verified against the 424B4: SAFE $33.5M (2024, exact date unknown, $1.0M later refunded), Seed $10.0M, A $70.0M, A-2 $70.0M, IPO $150M at $15.00. Not confirmed: underwriter option exercise (1.5M shares), which investors joined which Series A closing.'
