company: antares-nuclear
name: Antares Nuclear
sector: fission
notes: 'Primary sources: antaresindustries.com update posts (fetched directly); ANS Nuclear Newswire used only for the Series
  B equity/debt split (reported). Search quota exhausted. Rounds are split into equity and debt events sharing round_group
  (Series B: $96M = $71M equity + $25M debt; Series C: $470M = $370M equity + $100M debt); the company letter states $96M
  Series B but the split is from ANS only. Lifetime total: ANS says ''more than $130 million'' to date after Series B (consistent
  with 8+30+96); census lifetime left undisclosed. Valuation not found. Public money: Air Force SBIR Phase 2 x3 totalling
  $3.75M (2024-09); DOE GAIN voucher (in-kind, no amount); $161M Space Force Strategic Breakthrough award (2026-09-11; entered
  as up_to because the post does not say whether the amount is obligated or a ceiling; ANS describes it as a DoD award); Army
  Janus OTA (no value stated); DOE Reactor Pilot Program, criticality agreement and HALEU allocation carry no money. TechCrunch
  2026-07-27 corroborates the Series C and says Antares is one of three finalists in the Pentagon ANPI programme (not recorded).
  Slug humba-ventures and pathbreaker are proposed (not in investors.csv).

  [pass2] Pass 2. Searched for lender names and drawn amounts for the Series B ($25M) and Series C ($100M) debt parts: the
  company Series C post, TechCrunch (2026-07-27) and ANS (2025-12-04) name no lender and no drawn amount; not found. Web search
  budget was exhausted, so no other source was reached. SEC Form D search (efts, 122 hits for ''Antares'') returns namesakes
  only (e.g. Antares Unitholder Investment LLC); no Antares Nuclear Form D found. No USAspending/SBIR record matched earlier.
  TechCrunch states ''Altogether, Antares has raised $604 million'' (PitchBook-based, cumulative, not recorded). Added: five
  agreements from the company updates page (fuel supply and programme selections), none with money stated.'
