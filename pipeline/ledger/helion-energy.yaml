  note: "3 corrections. (1) ARPA-E ALPHA announced_on 2014-08-24 was the ALPHA programme release date (identical on the programme node), changed to USAspending date_signed 2015-09-29 (new snapshot f20bc6c3 of the award detail API); (2) its USAspending amount evidence quoted only the award id/recipient, replaced with '\"total_obligation\":3971263.0' and obligated_usd added (outlays null). (3) Series G final close announced_on evidence quoted 'on Tuesday' without a date; replaced with the GeekWire byline date (Sep 15, 2026). Checked and left: Series G initial/final modelled correctly (final supersedes initial, publish excludes the $465M); Series E $1.7B milestone money not counted; Altman $375M participant amount is reported (GeekWire citing CNBC); Series F valuation uses company figure $5.425B; 2015 Form D security type is equity (isEquityType true in the XML). Not confirmed: Series D ($40M, Moskovitz lead) still rests on the Helion release (Wayback) alone, no independent copy found (GeekWire 2020 URLs 404, search budget exhausted); Series A-C (~$26M) unevidenced; Nucor agreement type offtake/definitive is an inference from 'agreement to develop' wording (could be partnership)."
