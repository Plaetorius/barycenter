company: helion-energy
name: Helion Energy
sector: fusion
notes: 'Built 2026-10-05. helionenergy.com is ToS-forbidden (P2): every company release is a Wayback copy (original_url set); all 2014-2026 amounts are corroborated by an independent source except where
  noted below.

  (1) Series G edited in place: the Wayback copy (2026-09-25) of the 2026-06-04 release carries an UPDATE banner saying the round closed at $500M in September 2026 up from $465M. Modelled as two events:
  helion-series-g-2026-06-initial ($465M) and helion-series-g-2026-09-final ($500M, supersedes the initial). Do not sum them. GeekWire 2026-09-15 reports the +$35M extension (new crossover, pension and
  sovereign wealth investors, unnamed). A closed_on date for the final close is not stated (only ''September 2026''). The Series G release names a ''university endowment fund'' (unnamed).

  (2) Conflict: Helion release says Series F post-money $5.425B; TechCrunch wrote $5.245B (apparent typo). Ledger uses the company figure. Series E valuation $3B is ''reported'' (GeekWire citing Axios).
  GeekWire''s June 2026 related-links line says ''$463 million'' in one place; $465M used everywhere else.

  (3) Series E also carried ''the opportunity for an additional $1.7 billion ... tied to Helion reaching key performance milestones'' (committed, milestone-contingent). Not recorded as money raised. Altman''s
  own $375M is stated by GeekWire (citing CNBC), recorded on his participant row only.

  (4) 2015 event: SEC Form D for Helion Energy, Inc. (first sale 2015-06-19, filed 2015-07-06): $10,614,202 sold of $21,228,400 offered, 6 investors. No investor names, no round label, security type not
  visible in the extracted text (assumed equity); announced_on is the Form D filing date because no announcement exists. TechCrunch 2021 says Sam Altman has been an investor and chairman since 2015 but
  ties him to no specific round, so no participants are recorded. Form D amounts are ''sold at filing time'' and may understate the final round.

  (5) Seed 2014: Form D (first sale 2014-07-29, $1,499,986, 3 investors) and TechCrunch (2014-08-14, YC and Mithril $1.5M). Mithril ''led'' per CEO quote in TechCrunch 2021.

  (6) Series D ($40M, led by Dustin Moskovitz, $1.25B valuation, closed 2020-09-22): single-source (Helion release via Wayback). No independent article could be archived (search budget exhausted, GeekWire
  search 403). The Series D release and GeekWire 2021 (''$72 million in venture capital and $5 million in government grants'' before Series E) are consistent with the $77.8M cumulative figure. Reviewer:
  find an independent source.

  (7) Gaps: Series A, B, C are not evidenced. Between the 2015 Form D and Series D the company raised roughly $26M that I could not attribute to named rounds ($77.8M cumulative - $40M Series D - $1.5M seed
  - $10.6M 2015 - $5M grants). No Wikipedia/Crunchbase/PitchBook used. Wikipedia (not cited) mentions ''$7 million from NASA, DOE and DoD'' before 2014; not found in USAspending/SBIR probes (SBIR probe
  found 0 Helion hits; early SBIRs likely went to MSNW, not Helion), so not recorded. INFUSE/FIRE/Milestone: probe notes show no Helion award.

  (8) ARPA-E ALPHA: ARPA-E project record release date 2014-08-24 and amount $3,971,263; USAspending shows DEAR0000563 with period 2015-09-28 to 2018-09-29, same amount, no outlays reported. [verifier: that release_date is the ALPHA programme
  date; announced_on changed to USAspending date_signed 2015-09-29.]

  (9) SEC Form D 2026-09-11 for ''HII Helion Energy-01, a Series of HII Helion Energy LLC'' (CIK 2155060, $4,552,131, 53 investors, Hiive Markets sales compensation) is a pooled secondary vehicle holding
  existing Helion shares, not Helion company financing: deliberately not an event. Helion itself filed no Form D for the 2020-2026 rounds.

  (10) Nucor: the Sept 2023 agreement ''includes an investment by Nucor in Helion'' (amount undisclosed); recorded as an equity event with no amount plus an agreement. Series F and G release lists describe
  Nucor as an existing investor. Not recorded: OpenAI power-supply negotiations (GeekWire 2026-03-23, a report only), Orion site permits/licences (regulatory, not funding), Helion''s own grants to 20 research
  institutions (outflow). Orion groundbreaking July 2025 (Reuters, blocked by robots.txt).

  (11) University endowment investor in Series F and G is unnamed in sources, so no participant row.'
