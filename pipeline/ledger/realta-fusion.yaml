company: realta-fusion
name: Realta Fusion
sector: fusion
notes: 'Sources: company releases (PRWeb, PR Newswire), SEC Form D, SVB release, USAspending. WebSearch budget was exhausted so only known URLs were fetched. Seed: release says the $3M DOE award was from
  the ''Fusion Development Program'' while TechCrunch (same day) calls it an ARPA-E grant; slug doe-fes used provisionally, reviewer should confirm the programme. The press release headline total ($12M)
  combines the $9M seed and the $3M DOE award; they are recorded as separate events and must not be double counted. Series A: Form D (filed 2025-05-13) shows 35,510,568 sold, consistent with the $36M announced;
  the Form D notes it ''Includes conversion of previously issued SAFE'', so part of it may be converted earlier money. Form D 2023-05-26 shows 8,999,996 sold (seed). Per-investor amounts are not stated
  anywhere. GSBackers is a crowd-investing platform (Form D for ''GSBackers Realta Fusion Fund I'' filed 2025-05-21). USAspending Milestone award DESC0024887 ($12,467,500 total obligation, signed 2024-06-03,
  no cost share recorded in the award; outlays 3.14M): DOE says awardees fund >50% of milestone cost, and $46M was initially committed across 8 awardees, so total_obligation is a program ceiling-style figure;
  reviewer should reconcile. USAspending also lists REALTA SYSTEMS LLC (DESC0024958, $196,670), a different legal entity not confirmed as related; not recorded. Seed/pre-seed investors named in the investor-edges
  probe (Alumni Ventures) have no evidenced round and are not recorded. No EU/UK/German public money applies (US company).'
