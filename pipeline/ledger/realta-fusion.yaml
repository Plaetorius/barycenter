  note: >-
    3 corrections. (1) The $3M 'DOE Fusion Development Program' award announced with the seed on 2023-05-31 is the
    first-period amount of the Milestone-Based Fusion Development Program award (selections announced the same day;
    USAspending FAIN DESC0024887 to REALTA FUSION INC., CFDA 81.049 Office of Science, not ARPA-E as TechCrunch said):
    marked amount_kind duplicate, supersedes realta-doe-milestone-desc0024887, so the award is counted once at the
    USAspending obligation ($12,467,500; outlays $3,140,000 as of 2026-08-25). (2) Series A announced_on 2025-05-14
    (ESG Today) -> 2025-05-13 (PR Newswire release date). (3) SVB $9.5M growth capital facility -> amount_kind ceiling
    (no drawn amount stated). Residual: the Milestone obligation is milestone-tranched and only $3.14M has been paid;
    the $12.47M figure is an obligation, not cash received. Seed $9M matches Form D $8,999,996; Series A $36M matches
    Form D $35,510,568 (includes SAFE conversion, earlier SAFE money not separately evidenced).
