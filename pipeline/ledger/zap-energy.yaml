company: zap-energy
name: Zap Energy
sector: fusion
notes: |-
  Built 2026-10-05. Sources: Zap Energy releases (zapenergy.com is robots-allowed, no ToS found), Chevron release via Wayback, TechCrunch 2022-06-22, SEC Form D (CIK 1714402), ARPA-E project JSON, USAspending, DOE FIRE/Milestone article.
  Gaps / review items:
  - No evidenced seed round. Zap emerged ~2017-18 (ARPA-E OPEN 2018 selection 2017-12-13); the 2019-08-28 Form D (offering $7.2M, $1.1M sold, 1 investor, accession 0001714402-19-000002) probably belongs to the pre-Series-A / Series A financing and is NOT recorded as a separate event. Series A amount ($6.5M) comes only from Zap's own Series B release; Series A participants beyond Chevron Technology Ventures are not named in a Series A release (Lowercarbon is called an 'existing investor' in May 2021).
  - Several Zap /updates pages (Series C 2022, Mizuho 2024, Soros/Emerson 2024-09, EIP fund, $5M DOE grant) are empty-body redirect stubs on the current site; Series C was recovered from the 2022 Wayback copy of Zap's own release. Probe snapshot 'zap-energy-confirms-130m-round' is an empty body (e3b0c44298fc).
  - Form D amounts are tranche/'sold so far' figures and are used only as corroboration (Series B $25.2M of $27.5M sold; Series C D/A $162.6M vs $160M announced; Series D $130.0M sold, 40 investors). Not separate events.
  - DOE Milestone program: $5M initial federal funding (Zap release 2023-05-31). DOE says $46M initially committed across 8 awardees and payment is per verified milestone; milestone 1 certified 2025-02-25 and the preconceptual design milestone approved 2026-05-19 (Zap releases), but no payment amounts are stated, so no extra events. USAspending has no Milestone row for Zap. Modelled as cost_share (company contributes more than 50%).
  - ARPA-E: selection amounts from ARPA-E JSON, obligated and outlays from USAspending (DEAR0001010 $6,767,334 obligated, $4,092,066.87 outlaid; DEAR0001260 $999,189.16 obligated, $537,961.64 outlaid). Dates are selection announcement dates.
  - Also seen but not recorded as funding: 2025-07 award of 1M supercomputer node-hours (in-kind compute); 2024-09-22 White House/UAE joint statement (used only as evidence that Plynth Energy invested).
  - Not found / not checked: INFUSE and FIRE awards (INFUSE awardee lists are JS-heavy and were not parsed; FIRE awardees are labs/universities per DOE), SBIR (probe found 0 Zap hits), Washington state grants. WebSearch budget was exhausted, so no broader sweep was possible.
  - TechCrunch 2026-08-15 (FusionX data) states $325M raised; sum of events here is 6.5+27.5+160+130 = $324M private equity, consistent.
