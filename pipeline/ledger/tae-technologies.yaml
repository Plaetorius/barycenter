notes: >-
  Built 2026-10-05. TAE origin tae.com is ToS-forbidden (P2): every tae.com fact uses the Wayback copy (original_url set) and is
  corroborated by an independent source (SEC filing by Trump Media & Technology Group CIK 1849635 / TMTG-TAE S-4 filed 2026-09-30,
  CNBC, TechCrunch, GeekWire). The probe-time direct snapshots of tae.com (34795481fc16, 7dfcf3687bc4) were NOT used.
  TAE has no Form D under its own CIK; the S-4 (which contains TAE audited FY2026 and Q1 FY2027 statements, FY ends 31 March) is the best primary
  source for 2024-26 financing. Pre-2021 rounds (Tri Alpha era, 1998-2020) mostly have no per-round amount anywhere in fetchable
  sources: only cumulative statements ($500M+ by 2018, $880M in 2021) are recorded; Goldman Sachs, Vulcan, Venrock, NEA, Rusnano, Wellcome
  Trust, Kuwait Investment Authority, Google are attached to the cumulative events where a source names them as backers (not necessarily
  as participants of a single round). Reuters 2021-04-08 article is robots-blocked and was not used.
  OVERLAP WARNING: the June 2025 ">$150M" release is almost certainly part of the Series 12 financing (Aug 2024 - Dec 2025; Series 12
  purchase agreement amended 2025-05-30); all three carry round_group series-12 and must not be summed. Series 12 gross proceeds in the S-4
  ($146.6M FY ended 2025-03-31, $56.8M FY ended 2026-03-31) include non-cash conversions of SAFEs ($97.6M), notes ($30.0M and $22.4M); cash
  was $19.0M and $34.4M. The press ">$150M" cannot be reconciled to these figures from public data; flag for reviewer.
  Conflict: CNBC 2022 says July 2022 was "Google's first cash investment"; the S-4 shows a Google warrant under a 2017 services agreement.
  Government grants: S-4 says TAE "has received over eight awards from the United States' Department of Energy" without amounts or dates;
  no ARPA-E / SBIR / Milestone award found in earlier probes (probes/arpa-e.md, sbir.md, doe-programs.md); INFUSE page snapshot is JS-heavy
  and had no TAE hit; USAspending not queried (POST API, no archived wrapper available). No DOE grant event recorded: revisit.
  Not recorded: Linqto Liquidshares secondary vehicle (Form D 2023/2024, secondary, not company funding). WebSearch budget was exhausted so
  TAE Life Sciences, Rusnano 2012 and 2007 round details come from Wikipedia/GeekWire only. TMTG merger not closed as of the S-4 (expected Q4 2026).
  VERIFIER (2026-10-05): Series 12 counting now = tae-series-12-fy2025 ($146.6M) + tae-series-12-fy2026 ($56.8M) = $203.4M; the SAFE
  event ($97.6M, converted into Series 12 inside the $146.6M) and the June 2025 ">$150M" release are marked duplicate of
  tae-series-12-fy2025. Cash timing: SAFE cash came in FY2024-25 ($29.7M of SAFE proceeds in FY2025 cash flow), so the S-4 figures are
  booked at Series 12 dates rather than when the SAFE cash arrived. tae-series-12-fy2026 announced_on 2025-04-01 is a fiscal-period
  placeholder (S-4 gives only the fiscal year), not a release date. The TMTG May 2025 PIPE / $1B convertible notes are TMTG's own
  financing and are NOT TAE funding. The merger is all-stock (no cash to TAE at close per the 8-K); the ">$6B" CNBC figure is the
  headline deal value and may describe the transaction rather than TAE's standalone valuation. The 2023 TAE Power Solutions, LLC Series A
  units were sold by a subsidiary (consolidated; recorded as noncontrolling interest, $61.1M NCI sales in FY2024 cash flow).
