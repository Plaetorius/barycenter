  note: >-
    5 corrections: SAFE $97.6M marked duplicate of Series 12 FY2025 (converted into it); June 2025 >$150M release marked duplicate of
    Series 12 FY2025 (same round, the 12th); TMTG note tranche 2 ($100M up_to) set to ceiling (undrawn per 2026-09-30 amended note);
    2021 $280M round_label "Series G" removed (S-4 quote only lists share series, does not tie G to 2021) and TechCrunch date added;
    Series 12 FY2025 amount evidence extended with the S-4 non-cash conversion breakdown. Not confirmed: 2007 $40M and Rusnano 2012 rest
    on Wikipedia only; ">$6B" merger value is press-only and ambiguous; DOE awards ("over eight") not quantified; G-2 participants
    Reimagined Ventures and TIFF are named as "most recent investors", not explicitly in G-2.
