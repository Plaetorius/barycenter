company: nano-nuclear-energy
name: NANO Nuclear Energy Inc.
sector: fission
notes: >
  Public company (Nasdaq: NNE, CIK 1923891, fiscal year ends Sep 30). Primary evidence is SEC EDGAR (8-K, 424B4/424B5, 10-K
  for FY2025 filed 2025-12-18, Form D XML); data.sec.gov submissions snapshot 57c0ac6c4a83 was used to enumerate filings.
  Census slug nano-nuclear-energy (universe-fission.csv). Convention for public-company offerings: one event per
  offering/programme. IPO, July 2024 and October 2024 follow-ons are recorded at the base firm-commitment gross amount; the
  over-allotment closings are separate evidence items on the same event (IPO +$1,537,500 on 2024-05-22; July 2024 +about $2.7M
  on 2024-07-18; Oct 2024 +about $5.4M on 2024-10-29, per the FY2025 10-K and 8-Ks) and are NOT added to the stated amount.
  Pre-IPO rounds (Seed/Angel/Series A/Series B) are from the IPO prospectus 424B4 (period text only, so announced_on is the
  first day of the month in which the round began and closed_on is the last day of the month it ended) and corroborated by four Form D filings (2022-04-27 $290,000 sold, 18 investors; 2023-02-16 $3,681,869,
  56 investors; 2023-06-08 $1,945,000, 12 investors; 2024-01-23 $2,166,437, 14 investors). The Form D amounts do not map
  one-to-one to prospectus rounds: Series A $1,945,000 matches the 2023-06 Form D exactly; Series B is $2,466,437 in the
  prospectus/10-K (822,144 shares at $3.00) but the Form D shows $2,166,437 sold (the other $360,000 was received after
  Dec 31 2023 per the prospectus). The prospectus figure is used. Also disclosed: a $5,000,000 put-right subscription for
  2,000,000 shares at $2.50 signed in FY2023 as part of the Series A round (mezzanine equity) - not recorded as a separate
  event because no date is given. The 2022-04 Form D ($290,000) is not mapped to a round. No investor in any pre-IPO round,
  PIPE or offering is named in the filings (unnamed institutional investors; placement agents Titan Partners Group for 2025
  PIPEs, Benchmark Company as IPO/follow-on underwriter), so no participants are recorded; underwriters/agents are not
  funders. Oct 2024 follow-on: the 8-K says closing on 2024-10-25 while the 10-K says 2024-10-23 (the 10-K date is the
  pricing/underwriting date); 8-K closing date used. Shelf registrations (S-3 up to $900M, effective 2025) are capacity, not
  events. The $400M ATM (sales agreement 2025-07-25; prospectus supplement filed 2026-03-13) is one event, ceiling recorded
  as up_to and amount_kind ceiling; the 10-Q for the quarter ended 2026-06-30 reports the first ATM sales ($26.75M, June 2026), recorded as event nano-atm-sales-2026-06 (verifier). Not evidenced / not recorded: any DOE cash grant
  (none found; only an unfunded-amount GAIN voucher and a subcontract under DOE's LEU Acquisition Program, no value stated);
  USAspending was not queried because the archive CLI is GET-only and the search endpoint is POST. Nano's own $2.0M equity
  investment in LIS Technologies (Aug 2024) is an outflow and is not recorded. Acquisitions (USNC assets $8.5M 2024-12, STS
  up to $13.0M 2026-05) are not funding; USNC and Radnostix deals are recorded as agreements (type partnership, nearest enum
  for asset purchases). HALEU Energy Fuel Inc. is a wholly-owned subsidiary (the acquirer in the Radnostix deal).
