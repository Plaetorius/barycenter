  integrated energy hub MoU with Groupe Unitel / Énergie Hub (2026-07-16). No value stated for any. NOT FOUND (WebSearch budget
  exhausted): the 2023 first round (amount, date, investors) and the France 2030 award date remain unsourced. The DAC filing
  for INB Alpha is a regulatory step, not funding. The pre-order is not a funding event and carries no payment amount.'
