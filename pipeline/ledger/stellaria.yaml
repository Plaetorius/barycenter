notes: >-
  Stellaria SAS (Paris; Grenoble lab; BODACC/CORDIS name Stellaria Design, SIREN 952843282; not the UAE geospatial company).
  Primary source: company release of 2025-07-17 (stellaria.fr); oilprice.com (2025-07-24) is a derivative that converts to
  USD24.8M and is not used for amounts. The 2023 first round is mentioned ("deux ans apres une premiere levee de fonds reussie
  en 2023"; Isospin Exergon invested "depuis le premier tour") but amount, date and investors are not in any source reached,
  so no 2023 event is recorded. The France 2030 EUR10M non-dilutive award ("Reacteurs innovants" call) has no award date in
  the sources; announced_on of that event is the 2025-07-17 release date that mentions it (not the award date). CORDIS: Stellaria
  is ENDURANCE associated partner with no EC contribution (no event). BODACC probe: capital changes dated 2023-12-17 and
  2025-09-02 (flags only, no amounts; OpenDataSoft mirror robots-disallowed, not re-archived). Canada G&C and TED probes have no
  records. A pre-order agreement with Equinix (2025-11-26) is listed on the company resources page but its page was not
  archived, so no agreement recorded.
