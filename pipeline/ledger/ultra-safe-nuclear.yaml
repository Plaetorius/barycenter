  note: 'USAspending merge: 2 DOE Office of Science grants added (DE-SC0021948 USD 196,201.53 to USNC-Technologies; DE-SC0022735
    USD 199,353 to Ultra Safe Nuclear Corp; both fully outlaid). Nothing skipped. Previous sign-off: verifier-agent (claude-opus-5-5),
    2026-10-05: 4 corrections: removed the Standard Nuclear ($28M stalking horse) and NANO Nuclear ($8.5M) Section 363 asset-sale
    events (purchases from the bankruptcy estate, not funding; facts kept in notes); JMB DIP $23M commitment set to up_to/ceiling
    (no draw evidenced, aggregator source); Form D announced_on moved from first-sale date 2020-01-30 to filing date 2020-02-07.
    Gaps: no pre-2024 rounds or grants evidenced beyond the 2020 Form D; DIP from ElevenFlo summary, not court filings.'
