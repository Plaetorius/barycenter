notes: 'Public company (Nasdaq: FISN, CIK 1918102); sources are SEC filings fetched from sec.gov/Archives (8-K 2025-09-05
  merger/Super 8-K, 8-K 2026-02-10, 8-K 2026-06-22, 8-K 2025-11-21, 424B4 2026-06-18). Legacy Deep Fission (inception July
  17, 2023 per the filing) reverse-merged into Surfside Acquisition on 2025-09-05 and sold 10,000,000 shares at $3.00 in a
  PIPE. CONFLICT with census: census records only the Sept 2025 $30M placement as lower bound; the filings also show an $80.0M
  private placement closed 2026-02-05 (net about $76.0M, $15.00/share, 5,333,333 shares; includes $20M from Blue Owl-affiliated
  funds per the 424B4) and a $40M IPO (2,500,000 shares at $16.00, closed 2026-06-22; 375,000-share over-allotment option,
  up to $10M cornerstone indications of interest not counted). SAFE notes ($1.5M 2023, $8.2M 2024, $1.6M H1 2025, about $11.3M
  outstanding at 2025-06-30) converted into 19,601,182 shares at the merger; event dates are period ends (the filing gives
  no closing dates) (the three amounts come from one sentence covering H1 2025, 2024 and 2023). 8VC SAFEs ($493,000+$7,000
  Jan 2024; $986,000+$14,000 May 2024, total $1.5M) are within the 2024 total. SAFE restatement and a 188,701-share SAFE settlement
  (May 2026) noted in the 424B4. Form D 2026-02-18 filed by the issuer exists on EDGAR (not archived as evidence; 403 on first
  fetch attempt). No ATM or follow-on programme found in the filing index (a 424B5 dated 2026-02-06 is a resale prospectus
  for selling stockholders (no company proceeds)). GAIN voucher NE-25-36439 has no stated date or amount (event dated by the
  8-K that discloses it). Reactor Pilot Program and the DOE OTA carry no dollar amount. No SBIR/ARPA-E money found. Halliburton
  MOU, Endeavour term sheet dates are approximate. Proposed slugs: endeavour-energy, halliburton. VERIFIER (2026-10-05): the
  2025 PIPE ($30M, 10M shares at $3.00, closed at the 2025-09-05 reverse merger) and the 2026-06-22 Nasdaq IPO ($40M gross)
  are distinct money; neither the PIPE nor the reverse merger is an IPO. 8-K events now use the filing/press-release date
  as announced_on and the closing date as closed_on. Open point: the same 8-K says 2024 financing cash flow came from SAFE
  proceeds of $8.6M and 2023 financing cash was $1.0M, versus SAFE aggregates of $8.2M (2024) and $1.5M (2023); the aggregate
  figures are kept (approx).

  [pass2] Gap-fill pass 2. Existing ledger already covers SAFEs, the 2025 PIPE, the 2026 $80M placement, the IPO, GAIN voucher
  and agreements. Added from the 424B4 (2026-06-18): the Parsons, Kansas site lease and the Urenco USA enriched-uranium procurement.
  The press-release list on deepfission.com shows an Aug 2024 item (Business Wire "Emerges from Stealth with $4M in Backing")
  but the Business Wire page returns 403 (archived as a 557-byte block page) and web search budget was exhausted, so that
  $4M round and its investors are NOT recorded; likely a duplicate of part of the 2024 SAFE aggregate in any case. No ATM,
  debt or public grant found in filings reachable. Placement agent warrants not valued.'
