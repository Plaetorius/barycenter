notes: >
  Company releases (novatronfusion.com) are primary. Series A1 amount: the Mar 2025 release says "oversubscribed funding
  round of EUR 10 million in equity"; the probe other-eu.md recorded "EUR 13M (St1)" from an unarchived search snippet
  -- conflict, not used; the 10M (company) figure is recorded. Release dates are taken from the newsroom category page
  list (M/D/YY). EIC Pathfinder TauEB: company release says 3 million (project total, EUR 2,944,905 per CORDIS, shared
  among 6 participants); Novatron's own net EU contribution EUR 1,499,000 per CORDIS (project 101186012, EC signature
  2024-10-25, start 2024-11-01), used as the event amount (quote ties the figure to the NFG participant block address; verifier confirmed the per-participant contributions sum to EUR 2,944,905). Q2 2026 recap says NFG "was awarded the EIC Accelerator", final
  funding decision subject to grant agreement: no amount or date, so not recorded as an event. Entity note: two PICs for
  Novatron Fusion Group AB (887579101, 880863306). Seed investors named: Climentum (lead), Industrifonden, Santander
  InnoEnergy Climate Fund, KTH Holding, EIT InnoEnergy; no individual amounts disclosed. Possible earlier pre-seed (2022)
  not found.
