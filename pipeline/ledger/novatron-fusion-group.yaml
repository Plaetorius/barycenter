  note: >-
    1 correction: the EIC Pathfinder amount quote was a bare figure; replaced with a quote anchored to the NFG block
    (amount followed by NFG's address). Adjacency confirmed: CORDIS contributions KTH 591,000 + KIPT 221,875 + NFG
    1,499,000 + KIC InnoEnergy SE 70,625 (+ third parties 158,030 and 16,250) + UKAEA 388,125 = 2,944,905, so the
    company's '3 million' is the project total and the NFG share is EUR 1,499,000. Seed EUR5M and Series A1 EUR10M equity
    match their releases; leads only where stated (Climentum; St1 'as lead investor'). Dates come from the newsroom
    list (M/D/YY) and match the release pages (seed 'Aug 29'). Not confirmed: the probe's EUR13M A1 figure (likely incl.
    non-equity), EIC Accelerator award (no amount), any 2022 pre-seed.
