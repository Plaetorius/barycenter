notes: >
  Wellington NZ levitated-dipole developer. Census row has no funding figure. Only two funding events could be evidenced
  in this pass: the NZ Regional Infrastructure Fund loan (Feb 2026) and Soul Capital's seed equity (Oct 2025, amount not
  disclosed). Earlier private rounds and the earlier NZ government grant (beehive release "Government backs fusion energy
  research", linked from openstar.tech/news-and-media) were NOT evidenced: beehive.govt.nz returned an Incapsula
  challenge page (snapshot d0203228 is not usable) and WebSearch budget was exhausted. Press headlines on openstar.tech
  also mention an Outset Ventures link (TechCrunch 2025-05-27), not checked. RIF loan: devdiscourse and RNZ (which says
  "commitment") are echoes of the Minister's statement; NucNet gives NZD35m (approx USD21m). Amount is a ceiling
  ("up to"). Soul Capital date is month precision (October 2025), stored as 2025-10-01. Kyoto Fusioneering MOU
  announced_on 2025-06-30 is taken from the release URL path (the page text has no date). Asia rule: Kyoto page is an
  English primary release, no amounts. OpenStar legal name Open Star Technologies Limited.
  Verifier: the RIF loan is "up to NZD35m", described as a "commitment" with no drawdown evidenced, so it is now
  amount_kind=ceiling (the notes already called it a ceiling but the event was new_money). The Minister's own statement
  (beehive.govt.nz) is not archived, so the loan rests on press (NucNet, RNZ) only. Soul Capital seed evidence is the
  investor's own portfolio page (third party, basis reported); amount undisclosed and the round size unknown.
