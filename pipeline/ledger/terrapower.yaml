company: terrapower
name: TerraPower LLC
sector: fission
notes: >
  Private company; no Form D under any TerraPower name (EDGAR efts probe 8784db91bd0d, 0 hits), so no EDGAR evidence.
  USAspending records the ARDP Natrium award under recipient "US SFR OWNER LLC" (UEI HVKCEHKLJ921) and the smaller awards
  under "TERRAPOWER LLC" (UEI G4XNL77M7DR1). CONFLICT, not reconciled: DOE's 2020-10-13 announcement says $80M initial
  funding each for TerraPower and X-energy; USAspending shows $1,696,938,130.80 obligated (cumulative, modified over time)
  on DENE0009054 plus recipient cost share (non_federal_funding) of $2,016,788,515 and total_funding $3,713,726,645.80
  (detail snapshot f1b652900cf6). TerraPower's own releases say the ARDP award "requires a match of 50% of project costs,
  up to $2 billion". The $80M and $1.70B are different measures (initial tranche vs cumulative obligation) and are kept
  as separate events; do not sum them. 2022 raise: release 1 (2022-08-15) says "minimum of $750 million", release 2
  (2022-11-03) says the raise concluded at $830M total, i.e. $750M plus $80M additional; modelled as two new_money events
  ($750M and $80M), the $830M is a cumulative total and is not a separate event. The 2025 $650M release says "including"
  so its investor list is partial; UBS (2025) and Credit Suisse (2022) were placement agents, not investors. Participant
  amounts: only SK's $250M is stated by the source. KHNP joined through SK's previously announced $250M, so it is not new money.
  NOT FOUND / BLOCKED: 2010 Series B ($35M, Khosla/CRV/Gates, per Reuters in investor-edges.csv) - reuters.com is blocked by
  robots.txt, no primary source found, so omitted; earlier rounds (2008 seed, 2018-2021) not evidenced. DOE HALEU allocation,
  Wyoming state money and DOE LPO: nothing evidenced (web search budget exhausted, energy.gov ARDP program page and
  terrapower.com/wyoming render without content); DOE LPO has no TerraPower loan in USAspending loan search (probe 2a20911efb92).
  Pennsylvania $10M grant is to the affiliate TerraPower Isotopes, stated by the state secretary, grant date unknown.
  VERIFIER: that event was REMOVED: the recipient is TerraPower Isotopes (TPI), a separate legal entity, and the source (snapshot
  8b75270ea3b0, 2026-05-06, "Our strategic $10 million grant helped to secure more than $450 million in private investment") does not
  name TerraPower LLC as recipient or beneficiary. ARDP: the DOE 2020-10-13 $80M is now amount_kind duplicate of the USAspending
  DENE0009054 obligation ($1,696.9M obligated, $972.4M outlaid), which is the counted figure. US SFR OWNER LLC is treated as
  TerraPower's ARDP project entity because DOE names TerraPower LLC as the ARDP awardee, the award is under the ARDP FOA
  DE-FOA-0002271, and the recipient address (15800 Northup Way, Bellevue WA) is TerraPower's headquarters; USAspending gives no parent
  and the ownership of US SFR OWNER LLC is not evidenced (co-owners, if any, unknown).
  Meta release says Meta "will provide funding" for deployment but states no amount; recorded as agreement, not funding.
verification:
  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  "on": 2026-10-05
  note: "5 corrections: ARDP USAspending event cumulative -> new_money (counted, obligated $1.70B) and DOE $80M announcement -> duplicate superseding it (same award), plus recipient-address and FOA evidence linking US SFR OWNER LLC to TerraPower; 2022-08 equity qualifier over -> exact with the Nov 2022 release quote ($750M first phase); KHNP 2026 event -> duplicate of the 2022 raise (through SK's $250M, no new money); Pennsylvania $10M TerraPower Isotopes grant removed (different legal recipient). Not confirmed: ownership of US SFR OWNER LLC; pre-2022 private rounds (2010 Series B etc.); HALEU, Wyoming, LPO support."
