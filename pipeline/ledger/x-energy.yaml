notes: "Public (Nasdaq: XE, CIK 2088896) since 2026-04-24; operating entity X-Energy Reactor Company, LLC (XERC), DOE recipient\
  \ \"X ENERGY, LLC\". PRIMARY EVIDENCE = the SEC 424B4 prospectus dated 2026-04-23 (snapshot db86c83f, filed 2026-04-27)\
  \ and USAspending JSON. P2 (x-energy.com is ToS-forbidden): no x-energy.com page is used as evidence. The Wayback Machine\
  \ (web.archive.org) refused connections from this host during the session, so Wayback copies of the x-energy.com releases\
  \ (Series C $235M 2022, Amazon 2024, Dow, IPO pricing) could not be archived; round amounts here come from the SEC prospectus\
  \ alone and investor lists are therefore incomplete (only participants named in the prospectus). Not recorded for lack of\
  \ an evidenced amount/date: Series A/A-1/B rounds, Series C (issued 2022-23; the prospectus only states the 2023-12-05 conversion\
  \ of C-1 Notes, the 2024-10-11 conversion of $98.0M of C-2 Notes into Series C units and 2025-09-30 conversion of the remaining\
  \ $18.4M, i.e. debt conversions), 2023 Bridge Loan from Ares Acquisition Holdings ($10.0M initial draw Oct 2023, further\
  \ draws $14.2M and $25.8M, settled $53.5M), Live Oak credit facility (settled 2024), Bank of New York facility ($20.2M settled\
  \ Oct 2024), and SPV Form D filings (Ares X-Energy Co-Invest LP $40.55M 2024-10-09; SCP X-Energy Holdco $19.2M then $29.9M;\
  \ Lightcone Series D SPV $19.0M 2026-02-05; X-Energy Management LLC $22.8M 2025-07-01, see docs/survey/probes/edgar.md).\
  \ No ATM program or follow-on offering found in the EDGAR submissions list up to 2026-09-04 (only IPO, S-8, 10-Qs, 8-Ks,\
  \ 13Gs). DISCREPANCY KEPT OPEN: the prospectus says X-energy was awarded \"an initial $1.2 billion\" under ARDP (cooperative\
  \ agreement DE-NE0009040: 50/50 cost share of $2.4 billion eligible costs, $1.2B reimbursement), while USAspending shows\
  \ total_obligation $921,717,024 (obligated to date), non_federal_funding $1,231,504,986.50, total_funding $2,153,222,010.50\
  \ and total_account_obligation $1,083,615,571.33 for the same award. They are separate events in round_group ardp-xe100-demo\
  \ and must not be summed; obligations are cumulative and revised by modification. A DOE-side announcement page was not fetched\
  \ (energy.gov origin snapshot not taken), so the DOE-announced figure is evidenced via the SEC prospectus. NOTE ipo-2026\
  \ announced_on is the prospectus date; ARK Investment Management only \"indicated an interest\" in up to $105.0M so no participant\
  \ amount is given. NOTE triso-x-48c-2024: the month (March 2024) is stated but not the day; 2024-03-01 is a placeholder;\
  \ it is a tax credit (instrument other), not cash. NOTE series-d-2025: investor names not stated in the prospectus passage;\
  \ Jane Street Global Trading appears only as an Original Equity Owner.\n VERIFIER (2026-10-05): ARDP follows the Kairos\
  \ convention: the DOE $1.2B reimbursement commitment is a ceiling (up_to, not all obligated), the USAspending obligation\
  \ $921.7M is the counted new_money figure (obligated_usd 921.7M, outlays 581.4M; total_account_obligation $1.08B differs\
  \ and is not used). The 48C $150M is a tax credit not yet realised (applies on placement in service), now a ceiling, never\
  \ cash. ARK removed as IPO participant: a non-binding indication of interest is not evidence of purchase. IPO: the Q2 2026\
  \ 10-Q says the over-allotment was exercised (about 50.9M shares at $23.00, about $1.1B net); the event keeps the stated\
  \ base-deal gross $1,017,857,157, so the counted IPO amount understates gross proceeds by about $153M (6,638,198 option\
  \ shares x $23, computed, not stated). Series C-1 $626.5M is cash only; the $20.0M Amazon note converted separately, so\
  \ no double count.\n[pass2] PASS2 gap-fill. Sources: SEC 424B4 (snapshot db86c83f, related-party and use sections not used\
  \ in pass 1), Wayback copies of three x-energy.com releases (ToS-forbidden origin, P2: Wayback only, original_url set) and\
  \ the Wikipedia article as the independent corroboration. WebSearch budget (200/200) was exhausted, so no further independent\
  \ sources could be searched. Wayback worked from this host this time. ADDED: (1) Series C-1 2024 participants named in the\
  \ Oct 2024 Amazon release (Ken Griffin, Ares affiliates, NGP, University of Michigan; no per-investor amounts). The release\
  \ says \"approximately $500 million\" while the prospectus says $626.5M raised in 2024 (cash C-1 in the existing event);\
  \ not summed or changed. (2) Series C completion 2023-12-05: additional $80M from Ares and Kam Ghaffarian, total Series\
  \ C $235M including anticipated note conversions; prior investors OPG, Curtiss-Wright, DL E&C, Doosan Enerbility. Only the\
  \ $80M is counted (the $235M is cumulative and overlaps the C-2 note conversions). The $80M has no second independent source\
  \ (Wikipedia corroborates only the $235M total, \"raised $235 million ... from existing investors\"). (3) C-2 convertible\
  \ notes 2022-23, $113.0M aggregate, $40M OPG, $30M Ares (SEC prospectus); announced_on is a placeholder for \"2022 and 2023\"\
  . They were later converted into Series C units (2024-10-11 $98.0M, 2025-09-30 $18.4M), so the Series C $235M and these\
  \ notes overlap: DO NOT sum them. Marked new_money here because the cash arrived as debt; a verifier may prefer to treat\
  \ as duplicate of the Series C figure. (4) Dow agreements: 2022 LOI, 2023 JDA (up to $50M of engineering, up to half ARDP-funded,\
  \ half Dow), 2025 master project development and commercial cooperation agreements; OPG 2022 framework agreement. Day-level\
  \ dates are placeholders where only the quarter/year is stated. NOT ADDED / OBSERVATIONS: Ares Acquisition Corporation SPAC\
  \ (announced Dec 2022, terminated Oct 2023; Oct 25 2023 release: Dow adds $20M convertible preferred PIPE commitment, total\
  \ Dow $40M, Ares $50M, Ghaffarian about $30M, total PIPE about $100M) never closed, so it is not a funding event. IPO underwriters\
  \ (prospectus and pricing release): joint bookrunning managers J.P. Morgan, Morgan Stanley, Jefferies, Moelis & Company\
  \ (lead joint book-runners), Cantor, UBS Investment Bank, TD Cowen, Guggenheim Securities, Wolfe | Nomura Alliance; schema\
  \ has no underwriter role so they are not participants. No cornerstone investors are named in the prospectus (ARK interest\
  \ was non-binding, already removed). Series A/A-1/B (2018-2021) and Series D investor names: not evidenced by any source\
  \ I could fetch (prospectus gives only carrying values; pre-IPO holders of 5%+ include Ares, Segra, Jane Street as holders,\
  \ which does not show round participation)."
verification:
  status: verified
  by: verifier-agent (claude-opus-5-5), 2026-10-05
  'on': '2026-10-05'
  note: '6 corrections: ARDP DOE $1.2B -> ceiling and USAspending $921.7M obligation -> new_money with obligated/disbursed
    fields (was cumulative, so nothing was counted); 48C tax credit -> ceiling; ARK (indication of interest only) removed
    from IPO; Series C-1 2024 qualifier exact -> approx with notes-to-FS quote; IPO over-allotment exercise evidenced from
    the Q2 10-Q (amount left at stated base gross). Not confirmed: Series D and C-1 investor lists (prospectus does not name
    them; x-energy.com is ToS-blocked and Wayback was unreachable for the author); pre-2022 rounds absent.

    [pass2 verify 2026-10-05, claude-opus-5-5] 17 pending items verified. Overlap decision: Series C $235M (2023-12-05) =
    $80M new cash + C-1 notes ($37.4M converted 2023-12-05, $20.0M 2024-03-29) + C-2 notes ($98.0M converted 2024-10-11):
    80 + 57.4 + 98.0 = 235.4. Only the $80M cash is recorded for the Series C and the $235M is not counted, so the C-2 notes
    ($113.0M cash received 2022-23 as debt) are separate new money, not a duplicate; no double count (C-1 notes are not recorded
    as an event). 2 corrections: Ares role lead -> participant on the Series C completion (the release does not say lead);
    C-2 round_label states the placeholder date and the conversions. Series C-1 2024 participants (Griffin, Ares, NGP, U-Michigan)
    verified from the Wayback copy of the Amazon release. Dow JDA (definitive, up to $50M engineering work as stated), Dow
    2025 MPDA (definitive), OPG framework (mou) verified; day-level dates are placeholders.'
