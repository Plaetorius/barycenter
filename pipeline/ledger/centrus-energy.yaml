company: centrus-energy
name: Centrus Energy Corp.
sector: fission
notes: |-
  Public company (CIK 1065059, ticker LEU; NYSE American through the FY2025 10-K and 2025 filings, the Sept 2026 8-K cover page shows NYSE). Not in the census CSVs under this slug as a developer (the census lists it under enrichment); slug centrus-energy as assigned. Primary sources are SEC filings (EDGAR submissions index snapshot 1a8382a2c54a, FY2025 10-K 046ee67114d3, 8-Ks, 424B5s). Per policy D8 one event per programme. NAMING CORRECTION: no "2023 Convertible Notes" or "2025 Convertible notes" exist under those labels; EDGAR shows two convertible issues, the 2.25% Convertible Senior Notes due 2030 (Nov 2024, $402.5M) and the 0% Convertible Senior Notes due 2032 (Aug 2025, $805M). No 2023 convertible found (2023 filings show only a Form S-3 shelf filed 2023-06-28, effective July 2023, and rights-agreement amendments). Net amounts raised per FY2025 10-K: $388.7M (2.25% notes) and $782.4M (0% notes) after costs; ATM proceeds $54.7M in 2024 and $523.7M in 2025 (both ATM programmes combined). Cash actually received under the Dec 2020 ATM was about $48M by Dec 2022 (424B5 of 2022-12-06) and $82.9M under the Feb 2024 ATM by 2025-05-09. DOE vs USAspending: DOE/company figures (headline award values) and USAspending cumulative transactions are kept as separate facts and not reconciled: the probe snapshot b121ea17e449 (recipient search AMERICAN CENTRIFUGE OPERATING, LLC, DOE awarding, 2019-10-01 to 2026-09-30) shows $1,376,015,708.17 while snapshot c235bd583a7e (search text CENTRUS ENERGY CORP.) shows $197,353,192.66 for the same recipient (UEI L8VHV5CNBV97); the reason for the gap is not known (different search matching, award coverage, or transaction netting). VERIFIER: the CENTRUS ENERGY CORP. text search only matches the subset of ACO transactions whose records carry the Centrus name (same recipient hash d527144c), so c235 is marked duplicate of b121 (the ACO recipient search, $1.376B, cumulative, not counted; it includes procurement contract obligations, not only assistance); the 2.7B Jan 2026 DOE package also has no listed Centrus LEU task order: DOE named ACO $900M for HALEU, General Matter $900M HALEU and Orano Federal Services $900M for LEU, so no DOE LEU task order to Centrus is evidenced. Centrus own investments (Oak Ridge more than $560M, Piketon expansion, Fluor EPC and Geiger Brothers contracts of Feb and Apr 2026) are spending, not funding, and not recorded. Not covered: pre-2019 history (2014 notes, Series B preferred), the Feb 2021 and Dec 2022 Series B exchanges and warrants with the MB Group (not new money), the 8.25% Notes redemption of 2025-03-26 (repayment), TENEX / Orano supply contracts, DOE ACO incremental modifications other than those listed (Phase 2 value rose from about $90M to $170.1M by 2025-12-31, only about $24M of that increase is separately evidenced as an event), an Oklo MOU (could not be found, web search budget exhausted; oklo.com not fetched per P2), fuel-supply customers other than Antares. Sept 2026 8-K (item 8.01) discloses advanced talks to acquire a manufacturing supplier for about $115-125M, not a financing event.
  MERGE 2026-10-05 (USAspending supplement): DE-NE0000530 (2012) predates the Centrus name (the company was USEC Inc. until 2014; USAspending shows the current recipient name) and is the parent itself, not ACO; it falls outside the 2019+ window of the b121 cumulative event, so it is not double counted. HALEU Operation Contract 89243223CNE000030 shows USD 332,041,412.48 cumulative obligation in USAspending (snapshot 9c87a3a865bd) versus USD 282.2M across the three ledger events (150M base + 24M + 108.2M); the gap is later modifications, not added as an event. The earlier statement that no DOE LEU task order to Centrus is evidenced is superseded: ACO holds LEU IDIQ task order 89243225FNE400178 (USD 0.5M, 2025-04-11, a report on new enrichment capacity), recorded as an agreement. USAspending 'Total Outlays' is account-level outlay data reported from FY2017/FY2020 onward, so disbursed_usd can understate payments on older awards.
verification:
  status: verified
  by: merge-verifier-agent (opus), 2026-10-05
  'on': 2026-10-05
  note: 'USAspending merge: 1 event added (DE-NE0000530 American Centrifuge Cascade Demonstration Test Program, 2012, USD
    147.95M obligated, recipient CENTRUS ENERGY CORP.); obligated/outlay figures attached to 2 existing events (HALEU Demonstration
    contract 89303519CNE000005: 172.97M obligated, 107.36M outlaid; HALEU task order 89243226FNE400212: 900M obligated, 0
    outlaid); 1 agreement added (LEU IDIQ report task order USD 0.5M). Skipped as already in the ledger: 89303519CNE000005
    and 89243226FNE400212 (same money as the demonstration and 2026 task-order events), 89243223CNE000030 (HALEU Operation
    Contract, USD 332.0M cumulative obligation, already covered by the base, Phase 2 increment and Option 1a events). Previous
    sign-off: verifier-agent (claude-opus-5-5), 2026-10-05: 11 corrections + 5 added ATM-sales events (per VERIFY check 6).
    Ceilings: three ATM programmes (Dec 2020 $50M, raised by a $24M Dec 2022 supplement; Feb 2024 $100M->$200M; Nov 2025 $1B)
    marked amount_kind ceiling; Feb 2024 announced_on evidence replaced by the supplement''s own date line. Actual ATM sales
    added from SEC filings: ~$48M under the Dec 2020 supplement to 2022-12-05; $24.4M (2023), $56.7M (2024), $533.6M (2025)
    from the FY2025 10-K; $55.0M in Q2 2026 from the 10-Q filed 2026-08-06 (new snapshot 3f1219d4). The figures are consistent:
    $1B less the $554.5M remaining at 2026-06-30 = $445.5M under the Nov 2025 programme, i.e. ~$390.5M in late 2025 plus $55M
    in 2026; this implies the Feb 2024 programme sold ~$199.9M in total. Convertibles: 2.25% due 2030 ($402.5M, priced 2024-11-05,
    issued 2024-11-07) and 0% due 2032 ($805M, announced 2025-08-12, issued 2025-08-18); instrument debt and dates confirmed;
    closed_on evidence added from the 10-K. DOE: HALEU Demonstration $115M -> up_to (8-K: DOE reimburses up to 80% of costs
    up to a $115M maximum; 10-K: later funded up to $173M); $900M HALEU task order -> up_to (performance-based milestone payments).
    USAspending: c235 ($197.4M) marked duplicate of b121 ($1.376B), see notes. Residual doubts: the HALEU Operation ~$150M
    base value includes Centrus''s ~$30M Phase 1 cost share (DOE share ~$120M, not quoted as such); the HALEU contracts are
    DOE procurement of HALEU/enrichment services, closer to revenue than to funding; the 2023 ATM figure ($24.4M) slightly
    exceeds the $24M Dec 2022 supplement ceiling; all awards are to subsidiary American Centrifuge Operating, LLC (wholly
    owned).'
