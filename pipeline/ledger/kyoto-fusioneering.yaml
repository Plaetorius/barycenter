  note: "6 corrections. (1) Removed kf-ffc-general-atomics-2025-08: the USD 20M strategic investment from General Atomics went to Fusion Fuel Cycles Inc., the KF and Canadian Nuclear Laboratories joint venture, not to Kyoto Fusioneering (snapshot 0dd110e4..., 2025-08-29). If needed, record it under FFC or as a KF partnership. (2) kf-series-d-credit-facilities-2026-08 (JPY 9.0bn, 'access to ... credit and loan facilities') is now ceiling/up_to. (3) kf-series-c-ext-debt-2025-09 (JPY 5.3bn 'debt financing and credit facilities', 'including credit facilities') is now ceiling/up_to, because the drawn part is not stated. (4-6) In-Q-Tel, Marubeni and Nichicon changed from participant to lead for the 2nd close of the Series C extension, per the release title 'Led by In-Q-Tel (IQT), Marubeni and Nichicon'. Not confirmed: the release pages carry no in-body date, so announced_on comes from the newsroom URL path (/news/YYYY/MM/DD/). The 2nd close names 3 of the '4 new investors'. Gaps: seed/A/B, Series C and the 1st close of the extension (about JPY 1.5bn implied by the 4.0bn extension total); INFUSE awards."
