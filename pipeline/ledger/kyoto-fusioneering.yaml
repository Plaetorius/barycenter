company: kyoto-fusioneering
name: Kyoto Fusioneering
sector: fusion
notes: 'Source: company English newsroom (kyotofusioneering.com/en/news). JPY amounts as stated; no FX applied. Series D is a FIRST close (more may follow). Series D release states cumulative equity JPY
  32.98bn (also ''over JPY 32 billion''), not modelled as a round. Series C release (2025-09) states Series C Extension cumulative JPY 4.0bn and total cumulative equity JPY 16.2bn; 2024-07 release states
  Series C total 13.1bn and 14.8bn since 2019. Earlier Series C rounds and the 1st extension close (announced before 2024-05) and seed/A/B rounds were not located (news listing walked back to May 2024 only),
  so history is incomplete. Series C ext 2025-09 headline JPY 9.3bn = 1.45bn equity + 5.3bn debt per breakdown plus the release''s own rounding (''combined 9.4bn''); recorded as the two components. FFC
  investment is by General Atomics into the JV Fusion Fuel Cycles Inc. (KF + CNL), not into KF itself; amount reported in KF''s English post, no quote date in-body (announced_on = post date 2025-08-29).
  KaLiAS BMBF grant amount undisclosed; its announced_on is the post date. NEDO grant amount from NEDO English company table (page last updated 2025-05-22); announced_on is the KF selection release date.
  Series D list of investors is ''select'', two further new investors and one lender are unnamed. Participant slug ''jic'' is for JIC Venture Growth Investments (JIC subsidiary; roll-up to be resolved later).
  INFUSE awards (2023, 2024) mentioned in KF releases without amounts; not recorded.'
