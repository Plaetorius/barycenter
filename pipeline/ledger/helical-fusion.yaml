name: Helical Fusion
sector: fusion
notes: 'Source: company English newsroom (global.helicalfusion.com/post/...). Series A 2025-07 total: release says JPY 2.3bn raised; ''total capital including grants and loans'' JPY 5.2bn (cumulative, not
  a round). Ext release 2025-12: Series A total incl. loans ~USD 21M (JPY 3.2bn), cumulative incl. grants and loans ~USD 38M (JPY 6.0bn); note JPY 2.3bn + 0.87bn = 3.17bn is consistent with ''including
  loans'' wording only loosely - reviewer check. MEXT SBIR Phase 3 (JPY 2bn per probe asia.md, Business Wire 2025-10-27) NOT recorded: no archivable English primary found (Business Wire blocked, MEXT notice
  Japanese, web search budget exhausted). Public-financing loans mentioned in the release (unnamed ''public financial institutions'') not quantified. Aichi grant is R&D funding within an acceleration program;
  2023 and 2024 selections not evidenced with amounts. Earlier seed rounds not found. METI fusion demonstration final-candidate status (2026-09-17) is not funding. HAZAMA ANDO MoU (2026-07-06) noted on
  newsroom but not archived/recorded as agreement.
  Verifier: cumulative figures reconcile: JPY 2.3bn (Jul 2025) + JPY 0.87bn extension = JPY 3.17bn, matching the Dec 2025
  "total Series A funding, including loans" of ~JPY 3.2bn; and JPY 5.2bn + 0.87bn = 6.07bn, matching the ~JPY 6.0bn total
  incl. grants and loans. So the extension is new money, but the JPY 2.3bn "Series A" headline itself appears to include
  loans from the unnamed public financial institutions (equity/loan split not disclosed); treat the instrument as mostly
  equity with an unknown debt component. No cumulative rows are recorded (correct: they must not be counted). The Tokyo
  "up to JPY 1 billion over three years" is the programme maximum per selected project, not an amount awarded or paid, so it
  is now amount_kind=ceiling. Aichi JPY 40M: the release says "together with approximately JPY 40 million in R&D funding"
  without naming the payer explicitly; attributed to the Aichi programme on context, reviewer may want a Japanese source.
  Tokyo release date shows "Apr 6" without a year on the page; 2026 inferred from "FY2026" in the text.'
