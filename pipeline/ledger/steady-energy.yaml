company: steady-energy
name: Steady Energy
sector: fission
notes: >-
  Spun out of VTT in 2023. Steady Energy became a wholly owned subsidiary of 3North Partners Plc (Nasdaq First North
  Finland listing, trading from 2026-10-02) via a share exchange signed 2026-09-11; the IPO page states trading in series A
  shares started 2 October 2026 and the offering was oversubscribed. The 3North IPO is budgeted at up to EUR5M gross;
  actual final proceeds were not found in the archived page, so no amount is invented (amount recorded is the stated cap,
  qualifier up_to). Round B: EUR22M announced 2025-03-10 was described as "very close to completing its B-round"; the
  round closed at EUR32M on 2025-07-01. The 22M event is marked amount_kind duplicate (supersedes steady-2025-series-b-close): it is the first tranche of the
  same 32M round, do not add them. Seed (EUR2M, 2024) and the
  Business Finland / Tesi earlier tranches named in the census could not be sourced: WebSearch budget was exhausted and the
  company newsroom items for them were not located, so no seed event is recorded. Business Finland EUR10.5M is described as
  a "loan" (R&D financing) in the company release. EIB up to EUR40M senior unsecured convertible loan is part of the
  3North package (finance contract is with 3North Partners). Probe samples for Canada G&C, CORDIS, TED and BODACC found no
  Steady Energy records. VERIFIER (2026-10-05): the EIB up-to-EUR40M convertible is a facility maximum with no drawn amount
  stated, and the legal borrower is 3North Partners Plc (Steady's new parent), so it is amount_kind ceiling. The IPO up-to-EUR5M
  is the offering cap (final proceeds unknown), so also ceiling. The EUR69.8M private placement is subscribed into 3North
  Partners Plc (legal recipient = parent of Steady after the share exchange; proceeds released to the combined company);
  commitments were conditional, and completion is inferred only from the listing going ahead on 2026-10-02.
