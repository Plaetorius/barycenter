company: rolls-royce-smr
name: Rolls-Royce SMR Ltd
sector: fission
notes: >-
  Subsidiary of Rolls-Royce Holdings plc; only distinct financing of Rolls-Royce SMR Ltd is recorded (parent-company
  finance is excluded). Correction to the brief: contemporary 2021 sources (WNN, BBC) name Rolls-Royce Group, BNF Resources UK
  and Exelon Generation as the GBP195M investors; Qatar Investment Authority is listed as a shareholder only on the company
  investors page (and later press), with no date or amount, so QIA is not entered as a participant of the 2021 round. The
  UKRI grant (GBP210M, announced 2021-11-09) is public funding matched with the GBP195M equity; do not add them together as
  one round. GBE-N: contract formally signed 2026-04-13 after the June 2025 preferred-partner selection; the contract value
  is not announced (GBP2.6bn is GBE-N's Spending Review allocation, not an award to Rolls-Royce SMR), so the agreement
  carries no value. The National Wealth Fund loan (up to GBP599M, market rate, for generic design work) was announced on the
  same day; reported by New Civil Engineer quoting the government statement (no direct gov.uk page was archived for it).
  CEZ took a 20% stake in October 2024 for "several hundred million pounds" per the Czech PM office (no exact amount; not
  entered). Canada G&C, TED (no RR SMR notice), BODACC (UK company) and CORDIS (UK, not funded) probes have no records.
  Verifier: the NWF loan is a facility "made available" ("the loan would be issued"), with no drawdown reported, so it is a
  ceiling (programme maximum), not money received. The GBP195M equity is committed "over about three years" (phased), kept as
  the announced commitment.
verification:
  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  "on": 2026-10-05
  note: "1 correction: NWF loan (up to GBP599M, 'making a loan available', 'would be issued') set to amount_kind=ceiling, as no drawdown is evidenced. Checked: GBP195M equity investors are Rolls-Royce Group, BNF Resources UK and Exelon Generation (WNN 2021-11-09); QIA correctly excluded (no dated evidence of participation in this round); GBP210M UKRI grant is separate public money; CEZ 20% stake has no amount, and whether it was primary (new shares) is not evidenced. Gaps: NWF loan rests on press (NCE) only, no gov.uk page archived; GBP195M is committed over about three years."
