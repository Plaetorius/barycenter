notes: 'WebSearch budget was exhausted; the 2022 seed round has no archivable release. SEC Forms D by Xcimer Energy, Inc.
  (CIK 1916136) exist: D/A filed 2022-04-01 (Series Seed Preferred, 6 investors) and D filed 2022-11-01 (SAFEs, up to $10,000,000
  offering), but the structured amount fields are ambiguous in the text-stripped snapshots so no seed event or amount is recorded;
  reviewer may add from the XML. The RTX Ventures amount is undisclosed (company release and FinSMEs agree). The release says
  ''raised nearly $200M'' in total, recorded as a cumulative statement, not a round. RTX also signed a teaming agreement (recorded
  as an agreement, not funding). Milestone award DESC0024890: USAspending total_obligation $39.5M but account obligations
  only $13.5M and outlays $8.5M; DOE states $46M was initially committed across 8 awardees and awardees pay >50% of milestone
  cost, so the $39.5M is treated as an upper bound (qualifier up_to). Earlier probe notes claiming no Milestone rows in USAspending
  were wrong: they appear as type-11 awards. ARPA-E award DEAR0002030 ($3,571,249 obligated, recipient cost share $1,258,217,
  2025-11-18 to 2028-11-17, ''Vision Open 2024'', HYPER-LASER). OC Xcimer Partners LLC Forms D (2025-11-10, 2026-09-25) are
  investor SPVs of an Alpharetta GA manager, not company rounds; not recorded. No EU/UK/German public money applies. Date
  of the RTX event: release dated 2026-09-10 (page header says Sept 9).

  [pass2] Gap-fill pass 2. Added the 2022 seed and SAFE financings from the SEC Form D XML (primary_doc.xml, CIK 1916136;
  EDGAR submissions list shows exactly three Forms D: -22-000001 (D, signed 2022-03-30), -22-000004 (D/A, filed 2022-04-01),
  -22-000006 (D, filed 2022-11-01)). Archived text drops the XML tags, so the three numbers "2500058 875000 1625058" are the
  schema-ordered fields totalOfferingAmount, totalAmountSold, totalRemaining (checked against the raw XML ordering). Series
  Seed: offering $2,500,058 (up to 1,320,755 Series Seed Preferred shares), $875,000 sold at filing, 6 investors, first sale
  2022-03-28; the D/A repeats the original figures (no change in sold amount), so only one event is recorded. Amount is a
  "sold so far" figure (qualifier over), investors are not named in Form D (only 6 counted), no participants recorded. Nov
  2022 D: up to $10,000,000 in SAFEs, $365,000 sold, 1 investor, first sale 2022-10-21. Both are Form D tranche figures and
  may be partly the same money later converted into Series A; do not read them as the full seed. Not found: a press release
  for the seed (investors reported elsewhere, e.g. at Series A launch, but no archivable primary source); WebSearch budget
  exhausted. No other gaps found.'
