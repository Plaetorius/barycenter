notes: 'WebSearch budget was exhausted; the 2022 seed round has no archivable release. SEC Forms D by Xcimer Energy, Inc. (CIK 1916136) exist: D/A filed 2022-04-01 (Series Seed Preferred, 6 investors) and
  D filed 2022-11-01 (SAFEs, up to $10,000,000 offering), but the structured amount fields are ambiguous in the text-stripped snapshots so no seed event or amount is recorded; reviewer may add from the
  XML. The RTX Ventures amount is undisclosed (company release and FinSMEs agree). The release says ''raised nearly $200M'' in total, recorded as a cumulative statement, not a round. RTX also signed a teaming
  agreement (recorded as an agreement, not funding). Milestone award DESC0024890: USAspending total_obligation $39.5M but account obligations only $13.5M and outlays $8.5M; DOE states $46M was initially
  committed across 8 awardees and awardees pay >50% of milestone cost, so the $39.5M is treated as an upper bound (qualifier up_to). Earlier probe notes claiming no Milestone rows in USAspending were wrong:
  they appear as type-11 awards. ARPA-E award DEAR0002030 ($3,571,249 obligated, recipient cost share $1,258,217, 2025-11-18 to 2028-11-17, ''Vision Open 2024'', HYPER-LASER). OC Xcimer Partners LLC Forms
  D (2025-11-10, 2026-09-25) are investor SPVs of an Alpharetta GA manager, not company rounds; not recorded. No EU/UK/German public money applies. Date of the RTX event: release dated 2026-09-10 (page
  header says Sept 9).'
