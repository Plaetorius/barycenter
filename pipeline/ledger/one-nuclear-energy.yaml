company: one-nuclear-energy
name: ONE Nuclear Energy Inc.
sector: fission
notes: >-
  Business combination of ONE Nuclear Energy LLC with Hennessy Capital Investment Corp. VII (HVII, CIK 1846416,
  renamed ONE Nuclear Energy Inc.), closed 2026-09-23 per the 8-K filed 2026-09-29. The BCA contemplated a $1.0 billion
  equity valuation (Base Purchase Price paid entirely in stock) and had no minimum-cash or financing condition; this is
  a pre-money deal valuation, not recorded in a valuation field. Redemptions were heavy: 13,809,029 public shares
  redeemed for about $146.5M, leaving about $1.7M in trust per the 2026-09-29 8-K Item 2.01 but about $2.2M per the
  2026-09-23 8-K Item 8.01 (conflict; before expenses), so no cash amount is recorded on the SPAC event. A forward
  purchase agreement (2026-09-22) with New Circle Capital Solutions LP (New Circle bought 4,987,103 redeemed public
  shares) is not company funding. The HVII IPO (Jan 2025, 424B4 2025-01-17) is SPAC capital, not recorded. Pre-SPAC
  private funding of ONE Nuclear LLC, grants, and the 10-Q/S-4 financing details were not examined; WebSearch budget was
  exhausted. The sponsor and PIPE terms (if any) were not found in the closing 8-K. [Verifier 2026-10-05] HVII promissory note set to amount_kind ceiling: it is an up-to facility (max raised to $316,975 and then $620,000 by the 2026-08-07 omnibus amendment no. 3), drawn amount not stated, and the lender became the parent at closing. Gaps not recorded: B. Riley Principal Capital promissory note dated 2026-02-18 (amended seven times, $100,000 partially repaid 2026-09-23) and a B. Riley committed equity facility (CEF), both in the closing 8-K.
