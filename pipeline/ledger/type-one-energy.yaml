company: type-one-energy
name: Type One Energy
sector: fusion
notes: >-
  Type One Energy Group, Inc. (Knoxville TN; founded 2019 from UW-Madison). No issuer Form D exists on EDGAR (full-text
  search returns only the investor SPV "INVEXT Type One Energy, a series of Invext LLC", CIK 2075398, Form D 2026-01-27,
  not recorded as company funding). The company newsroom (typeoneenergy.com, no ToS bar) carries no funding releases
  (the 2023 seed and 2024 extension releases are not on the current site and were not found in Wayback), so rounds rest
  on TechCrunch (basis reported). WebSearch budget was exhausted, so earlier rounds could not be searched for.
  CONFLICT: TechCrunch 2026-01-14 calls the 2023 round a seed extended to $82.5M total in 2024; TechCrunch 2026-08-15
  (FusionX data) calls it an "extended Series A" totalling $82.5M. The 2024 extension tranche ($53.5M implied) has no
  date or investor list in any fetched source and is recorded only as a cumulative statement. Cumulative figures differ:
  more than $160M (TC 2026-01-14, Observer 2026-05), $174.5M (TC 2026-08-15); none are counted as rounds.
  Series B ($250M target at $900M pre-money, TC 2026-01-14) is not closed as of 2026-06-16 (company says it "prepares to
  close"); recorded without amount. Not recorded as events: (a) INFUSE-linked award DESC0025436 to Florida State
  University, $374,244.14, 2024-09-01 to 2026-08-31, description "TYPE ONE ENERGY COLLABORATION RESEARCH WITH INFUSE"
  (university recipient, policy D5; USAspending snapshot 47b5230ae6d4); (b) Tennessee Nuclear Energy Fund: WATE
  (f3890739f694) states Type One "was the first recipient of funding through Tennessee's $50 million Nuclear Energy Fund",
  amount and date not found; (c) Knox News (a2be15ec97b0) says a 2024 announcement of a "$223 million investment" in
  Knoxville HQ (company capex plan, not funding). No SBIR awards found (probe sbir.md). No FIRE award to the company
  (FIRE awardees are labs and universities). DOE Milestone per-company amount is undisclosed; $46M was the programme
  total across 8 awardees; announcement day 2023-05-31 comes from Zap Energy's own release of the same programme
  announcement (energy.gov article only says May 2023); VERIFIER added the Tokamak Energy 31 May 2023 release of the same selection as corroboration. ARPA-E BETHE selection $1.18M matches
  USAspending DEAR0001287 ($1,180,000 obligated, outlays $831,039, 2020-09-08 start). TVA agreements: the July 2025
  "first set of commercial contracts" has no stated value; Infinity Two is covered by an LOI only (final decisions subject
  to TVA Board approval). Not recorded: ORNL pellet injector agreement (2026-08-06), UK Infinity Fusion Consortium (May
  2026, with Tokamak Energy and AECOM), Barclays support (2026-07-21): no money or binding terms stated.
