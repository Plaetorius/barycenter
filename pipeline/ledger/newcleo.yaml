company: newcleo
name: newcleo
sector: fission
notes: >-
  Public via SPAC (NewHold Investment Corp III) since 2026-09-21; NASDAQ NWCL from 2026-09-22 (newcleo plc, CIK 2131813).
  Group has several legal entities (newcleo SA / newcleo Ltd / newcleo plc; SIREN 912522240, 929009140; newcleo SPA, Turin).
  Round history 2021-2024 rests on trade press (reported) because newcleo.com/news returned 404 and the Reuters and
  firstonline copies of the Sept 2024 EUR135M / USD151M round are robots- or Cloudflare-blocked, so that round is NOT
  recorded here (a reviewer should source it from the F-4 / 20-F history). Conflict: tech.eu (June 2022) says EUR100M raised
  in August 2021, born2invest/BeBeez says USD118M closed in September 2021; announced_on of that event is month-approximate
  (2021-09-01). The "EUR1bn round opened spring 2023" is a target, not recorded as funding; the 2024 EUR87M is its first
  tranche. The 424B3 states "approximately $780 million in total private capital" (cumulative, not a round). France 2030
  award (June 2023) amount not captured. Pre-PIPE / July 2026 Post-PIPE investors not named in the sources used; the
  July Capital Raise (EUR15.89M, partly collected) is mentioned only as a collected portion so no event is recorded.
  BODACC (capital-change notices for SIREN 912522240 on 2022-09-22 and 2024-02-01; 929009140 on 2024-11-12 and 2024-12-26)
  were not re-archived (the OpenDataSoft mirror is robots-disallowed); not used as evidence.
