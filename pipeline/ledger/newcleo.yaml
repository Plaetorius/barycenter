    1 correction: October Capital Raise round_label (the 424B3 says the redeemable bonds were never issued; shares were
    issued in lieu). Checked: EUR100M (Aug 2021, tech.eu) and USD118M (closed Sept 2021, born2invest) are the same round
    (EUR100M ~ USD118M at 2021 rates), not a conflict in amount; EUR100M + EUR300M (June 2022) = the 'over EUR400M'
    born2invest states, so the 2022 round is additional money, not cumulative. Month-only placeholder dates:
    2021-09-01 (seed, closing month), 2025-10-01 (October Capital Raise, 'In October 2025'), 2026-04-01 (Pre-PIPE; the
    424B3 elsewhere says subscriptions ran March-April 2026, EUR24.0M received in March). PIPE USD220M is the subscription
    commitment of 2026-05-26 (investors could satisfy it by open-market purchases of SPAC shares); actual PIPE and trust
    proceeds at the 2026-09-21 closing are not stated in the snapshots. Gaps: Sept 2024 EUR135M round, France 2030
    award, July 2026 Capital Raise (EUR15.89M), SPAC trust proceeds.
