company: thea-energy
name: Thea Energy
sector: fusion
notes: 'Thea Energy (formerly Princeton Stellarators Inc.). WebSearch budget was exhausted; sources are the company''s own press-release pages (thea.energy, robots-permitted), the PPPL INFUSE article, TechCrunch
  and USAspending. GAPS: (1) No seed round found; TechCrunch 2026-05-27 gives $130M total private (20 A + 100 B implies ~10 unattributed), TechCrunch 2026-08-15 says $120M across rounds: sources differ,
  neither recorded as a round. (2) Series B extension (2026-08-18) amount undisclosed; omitted. (3) DOE Milestone: the programme release gives only $46M total across eight awardees (no per-company figure).
  The $13.7M is USAspending ''Award Amount'' for DESC0024881 (Thea Energy, ''Stellarator fusion pilot plant enabled by array of planar shaping coils'', 2024-06-05 to 2027-06-04, type ''other reimbursable,
  contingent...''): matched by description to the Milestone project, but it is a total award value, milestone-contingent and may include company cost share; a reviewer should confirm against DOE. The event
  is dated at the 2023-06-01 selection announcement; USAspending base obligation date is 2024-06-03. The Jan 2026 DOE certification of the Helios preconceptual design (thea.energy release 2026-01-13) is
  a milestone, not a new funding event. (4) INFUSE: Thea says it has six INFUSE awards in total; only three announcements were found (Feb 2023 via PPPL: PSI collaborations, ''nearly $500,000'' is the total
  for the two PPPL collaborations, the money is received by PPPL, not Thea, so no amount is recorded (verifier); Jul 2023: one award; Sep 2025: three awards). Per-award dollars not stated for 2023-07
  and 2025-09 (programme totals $4.6M/18 projects and $6.1M/20 projects), so amounts omitted. INFUSE vouchers pay national labs, not the company. The 2023-01 awardee list on infuse.ornl.gov was not parsed
  (JS-heavy). (5) FIRE and SBIR: no Thea award found (FIRE awardees are labs/universities; SBIR probe found none). NJ state grants/tax credits (NJEDA) not found in the sources fetched. (6) No offtake/site/partnership
  agreements found; digital-twin collaboration with NVIDIA/Synopsys/Argonne/PPPL (2026) and Eos site evaluation are not binding agreements and not recorded. (7) Investor slugs for aloniq, alj-investments,
  beyond-earth-ventures are proposed (not in investors.csv). ''Whatif Ventures'' (release) = What If Ventures (TechCrunch); ''Idemitsu Kosan'' mapped to slug idemitsu.'
