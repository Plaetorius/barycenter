company: oklo
name: Oklo Inc.
sector: fission
notes: 'Public (NYSE:OKLO, CIK 1849056, ex AltC Acquisition Corp.). Primary evidence is SEC filings (EDGAR). oklo.com is ToS-forbidden
  (P2); the Wayback fallback (web.archive.org) was unreachable from this environment (connection refused) and WebSearch budget
  was exhausted, so no oklo.com or Wayback snapshot is used. Every fact is from a SEC filing, SEC JSON or a DOE/USAspending
  record. GAPS / NOT EVIDENCED: (1) pre-2023 priced equity (YC 2015 seed, Series A-1/A-2/A-3 incl. Hydrazine Capital II, DCVC,
  Accel, Draper, Moskovitz, SV Angel etc.): the S-4 gives only share counts and holders, no round amounts, so no events were
  created; (2) Vertiv agreement, Liberty Energy commercial agreement (only the SAFE is evidenced) and other newsroom items
  (newcleo, Blykalla, Siemens, KHNP, Lightbridge, TVA): not found in the archived SEC filings; (3) DOE HALEU fuel award (5
  MT, from EBR-II recovered uranium) is stated in the FY2025 10-K without a date, so its announced_on uses the 10-K filing
  date; (4) ARPA-E ONWARDS selection amount $3,999,836 (probe) differs from the USAspending obligation of $660,000 (DEAR0001619);
  only the obligation is recorded; USAspending lists the awarding agency as Department of Energy (DEAR = ARPA-E award prefix).
  The two S-3 shelves (up to $1.0B effective 2025-06-12, up to $3.5B filed 2025-10-30) are capacity, not events; ATM programmes
  drawn on them are events. The Equinix $25.0M prepayment (Mar 2024) is recorded as an agreement value, not as an event; the
  S-4 says it is treated as a Permitted Equity Financing. ATM convention: realised gross sales where a later 8-K states them
  (amount qualifier approx, ceiling in committed_usd); otherwise the ceiling (up_to). No PIPE exists in the Oklo business
  combination: the Sponsor Commitment (up to $50M) was not funded because Available Closing SPAC Cash exceeded $250M.

  [pass2] Second-pass gap-fill. oklo.com is ToS-forbidden (P2) and Wayback was not tried again; the WebSearch budget (200/200)
  was already exhausted at the start of this pass, so no press, Meta/Switch/Equinix release or pre-2023 round source could
  be searched for. Worked only from already-archived SEC filings and EDGAR submissions JSON (data.sec.gov CIK0001849056).
  Checked and found NO new funding events: 8-Ks of 2024-05-09/13 and 2024-11-06/13 (merger closing, earn-out and lock-up triggers;
  share issuances, not financing); the 2026 Q2 10-Q ATM table (2026 ATM programme gross $680.4M at 30 Jun 2026 is consistent
  with the ledger''s later realised figure, nothing new). Added one agreement: Centrus HALEU supply LOI (June 2026), from
  the Q2 2026 10-Q, no amounts stated. STILL MISSING (needs primary sources unreachable this pass): pre-2023 priced rounds
  (YC 2015 seed, Series A/B and investors: S-4 gives only share counts), Meta prepayment amount (not stated in 10-K or 10-Q),
  Equinix/Switch binding terms, Liberty/Vertiv/newcleo/Blykalla agreements (not in archived SEC filings).'
