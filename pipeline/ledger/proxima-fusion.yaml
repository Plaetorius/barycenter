company: proxima-fusion
name: Proxima Fusion GmbH
sector: fusion
notes: >-
  Sources: company releases (proximafusion.com, robots-permitted, no ToS prohibition found) plus FusionXInvest listing snippets for the 2023 pre-seed (reported).
  Company claims "more than EUR 650 million" total incl. EUR 95M public grants (2026-07-07 release); recorded as a cumulative event, never counted as a round.
  Pre-seed extension (2023-11-16): the listing says EUR 7.5M raised in pre-seed; the 2024 seed release calls the pre-seed "EUR 7.5M", so 7.5M is probably the pre-seed total, not new money; the extension event therefore has no amount.
  Seed: FusionXInvest listing says EUR 20M, company release says EUR 20M ($21.7M); consistent. Series A EUR 130M (2025-06-11) plus EUR 15M extension (2025-09-09) = EUR 145M; the extension release states EUR 200M total funding (private + public).
  EIC Accelerator: company states EUR 2.5M grant plus an opportunity for EUR 15M equity (EUR 17.5M blended); the equity part is an option, the EIC Fund appears as investor in the Series A extension and the EUR 411M round with amounts undisclosed. CORDIS shows EUR 2,471,437.50 (CSFPP 101188580) but CORDIS bulk is robots-disallowed and is NOT used here.
  Not recorded as events (no Proxima-specific amount): BMFTR Fusion Hub STRIDE (Proxima, Gauss Fusion, IPP; hubs total about EUR 125M, 2026-07-29, snapshot 4d4f0eb0...); Bavaria's potential EUR 400M (non-binding MoU, subject to federal funding; recorded as an agreement). Lower Saxony EUR 21M is a planned contribution to an HTS tape facility under an MoU (recorded as an agreement).
  SPRIND amount not probed; SPRIND and KfW Capital appear only as participants in the EUR 411M round. No Foerderkatalog, UKRI or EIB record found for Proxima (Foerderkatalog returns 403; Proxima Oxford is a subsidiary with no UKRI project found).
  Verifier (2026-10-05): the 2026-07-07 release says the >EUR 650M includes "EUR 95 million in public grants", but only EUR 9M of grants (EIC 2.5M, BMBF 6.5M) are evidenced as events here, so about EUR 86M of public grants is unaccounted for (possibly STRIDE hub, SPRIND or other awards). EIC grant qualifier set to approx (CORDIS shows EUR 2,471,437.50, not used as evidence).
verification:
  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  "on": 2026-10-05
  note: "3 corrections: STRIDE agreement announced_on quote replaced (old quote proved no date; new quote states 29 July); EIC grant qualifier exact -> approx (release figure EUR 2.5M is rounded vs CORDIS 2,471,437.50); BMBF grant program text notes the EUR 6.5M may be the consortium total. All amounts, dates, leads and participants otherwise match their quotes; cumulative EUR 650M correctly not counted. Gaps: about EUR 86M of the EUR 95M public grants claimed by the company is not evidenced; pre-seed rests on press (FusionXInvest) only; pre-seed extension amount unknown (EUR 7.5M is probably the pre-seed total)."
