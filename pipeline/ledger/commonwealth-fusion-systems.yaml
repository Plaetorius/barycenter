  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  'on': '2026-10-05'
  note: "6 corrections. (1) Series A double count: cfs-2019-06-series-a-115m changed cumulative -> new_money (it is the Series A round per Form D D/A and Axios) and its unsupported closed_on 2019-07-01 (D/A signature date) removed; (2) cfs-2018-03-eni-series-a-first-close set amount_kind=duplicate, supersedes the $115M event (Eni's $50M sits inside the $115M; 2018 Form D $64.6M from 5 investors + later sales = $115M). (3) cfs-2020-05-form-d-round relabelled 'Unlabelled 2020 equity offering (SEC Form D)' and round_group series-a removed (no source calls it Series A). (4) cfs-2026-07-additional-equity-1b round_group series-b removed (release does not call it Series B). (5) ARPA-E BETHE: amount changed from the $2.39M ARPA-E listing figure to the USAspending obligation $1,288,316.58 (project closed 2023, outlays $1.20M); the $2.39M kept as field selection_amount. (6) BETHE announced_on 2019-11-07 was the BETHE programme release date (same value on the programme node), changed to USAspending date_signed 2020-09-28. Not confirmed: Series B 2021 participants/lead (all archived press copies 403/404); 2020 round label and whether it reached the reported $84M; date the $115M Series A was first announced (Boston Globe, likely mid-2018; Axios 2019-06-28 used); whether DESC0021623 ($1.54M SC grant, same project title) overlaps the BETHE selection amount; INFUSE 2022A listing dated 'June 15, 2023' for the UCSD project looks like a site typo for 2022 (kept as published); whether Plynth stake is inside the $1B raise (no amount, so no double count)."
