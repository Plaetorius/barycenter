company: commonwealth-fusion-systems
name: Commonwealth Fusion Systems
sector: fusion
notes: 'Built 2026-10-05 under P2 (cfs.energy is ToS-forbidden): CFS release evidence is the Wayback copy (original_url set) corroborated by independent press (TechCrunch, Latitude Media, Richmond BizSense)
  and SEC Form D XML. web.archive.org later refused connections during the session, so older CFS releases (2018 Series A, Dec 2021 Series B, 2020 round, DOE grants pages) could NOT be fetched from Wayback;
  those rounds rest on SEC Form D (disclosed) plus independent press (MIT News, Axios).

  GAPS / CHECK: (1) Series B (2021) investor list and lead (Tiger Global lead per general knowledge) not evidenced: WSJ is paywalled; no participants recorded. announced_on 2021-12-02 is the Form D signature
  date; public announcement was reported around 2021-12-01. (2) 2020 round: Form D shows $80.6M sold of $100.0M offering (first sale 2020-05-11); press at the time reported ~$84M (bizjournals returned 403);
  label unverified. (3) Series A: Eni $50M announced 2018-03-09 (MIT News) is a tranche of the $115M Series A (Form D D/A 2019: $114,999,971, 24 investors, first sale 2018-05-30); [verifier: the $115M event is now
  the counted new_money event and the Eni $50M event is amount_kind=duplicate superseding it.] Original
  Form D 2018 showed $64,594,246 sold of $100.0M (5 investors). (4) Oct 2020 Form D for ''Commonwealth Fusion Systems PML SPV 1 LP'' ($1.975M, 10 investors) is an investor vehicle, not recorded as an event.
  (5) The Plynth Energy stake (2026-06-11, undisclosed) may be part of the $1B raise; Hyundai was stated to be part of the $1B raise (2026-09-10). Plynth kept as a separate no-amount event. (6) Total raised:
  CFS says $4B; FusionX via TechCrunch says $3.94B. (7) DOE Milestone Program: $46M initial obligations were across 8 awardees; CFS share undisclosed and no USAspending row; not split. (8) USAspending DESC0021623
  (DOE SC, $1.54M, 2021) and ARPA-E BETHE DEAR0001259 (obligated $1.29M + $1.55M non-federal; ARPA-E selection amount $2.39M) carry the same project title (''Pulsed HTS central solenoid''); relationship
  unclear, do not sum without reconciliation. (9) INFUSE: awards are lab-access vouchers with no dollar amounts on the program site; dates are the INFUSE listing dates; listing pages archived cover cycles
  2021B-2025 only (page 10+ returned the home page); earlier CFS INFUSE awards (2019-2021A) are likely but not evidenced. (10) FIRE: no company awardees (labs/universities only). SBIR: none found (probe).
  No Virginia state or Chesterfield County incentive amounts could be evidenced (virginiamercury returned 403). ARPA-E news item ''ARPA-E award boosts CFS quest for best fusion power plant materials'' (cfs.energy)
  not retrievable; the ARPA-E project index shows only BETHE for CFS. 2026-06/07 TechCrunch aggregator figures come from FusionX (reference only). Series B2 TechCrunch states no single investor led. Slugs
  ''moore-strategic-ventures'', ''schooner-capital'', ''dominion-energy'', ''ma-business-builds'' are proposed (not in investors.csv/public-funders.csv).'
