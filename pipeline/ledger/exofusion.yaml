notes: 'Built from USAspending spending_by_award search responses (POST, archived with request body in raw/manifest.jsonl, source_id
  usaspending-post). Amount = USAspending ''Award Amount'' (cumulative federal obligation, not a ceiling and not an announced figure);
  disbursed_usd = ''Total Outlays'' when present. Dates = ''Base Obligation Date'' (first obligation), else ''Start Date''. Search
  was recipient-name text on awarding agency = Department of Energy over 2007-10-01..2026-09-30 and one page of up to 50 rows per
  award-type group; awards with zero or negative net obligation are omitted. Recipient name variants not matched by the name search
  may be missing. Government record, basis=disclosed. INFUSE awards (in-kind lab-access vouchers; no dollar amount is published on
  the awards listing) from the ORNL INFUSE awards listing pages archived by the ledger-infuse/ledger-commonwealth-fusion-systems runs
  (infuse.ornl.gov/awards/ and /page/N). The listing gives project title, cycle, award date, company and host lab/university; the
  date shown is taken as announced_on. Vouchers are not cash and must not be summed with funding. VERIFIER: The INFUSE 2024 voucher''s
  host is Penn State University. INFUSE awards pay the host lab or university to do work for the company (in-kind, no cash to the
  company; D5: lab/university money is not company funding). Kept as amount-less voucher events for context only; they never count
  toward raised totals and do not by themselves satisfy D1.'
