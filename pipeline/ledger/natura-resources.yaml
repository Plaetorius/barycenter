notes: 'Company site is naturaresources.energy (aliases naturaresources.com; natura-resources.com from the census did not connect). Search quota exhausted and no primary release for a priced private round was reachable: the company boilerplate says only ''more than $120 million in private funding'' (cumulative, no investors, no dates; dated with the page date of the release carrying it) and a $120M State of Texas commitment. Texas commitment: the company milestone page dates it ''2025'' only, the event is dated by the earliest release in the snapshot set that states it (NGL release, 2026-02-03; it is a first-seen date, the commitment itself dates to 2025); the Texas administering agency/programme is not stated in the sources (HB 14 / Texas Advanced Nuclear Energy Office is a candidate, unverified), so the grantor slug state-of-texas is proposed. It is a commitment, not disbursed: amount_kind ceiling (visible, never counted in raised totals). The commitment is for the MSR-1 reactor at Abilene Christian University; whether the legal recipient is Natura or ACU is not stated in the sources. Founder Doug Robison donated $3.2M of research funding to ACU circa 2017 (Natura ''how a third-generation Texas oilman...'' article, Aug 2026): pre-company, not recorded. Federal money: Reactor Pilot Program carries no funds; DOE HALEU conditional commitment and FLiBe salt delivered 2026-09-18 from DOE/ORNL/INL are in-kind materials with no dollar value; USAspending (docs/survey/samples/doe-recipients-fy20-26.csv) shows Natura Resources LLC net 0 and Abilene Christian University USD 753,605 under CFDA 81.121 FY20-26, ACU is not Natura, so nothing recorded as a Natura grant. No ARPA-E/SBIR found (not searched specifically). Natura acquired Shepherd Power from NOV in 2025 (acquisition, not funding). Slugs state-of-texas, ngl-energy-partners, quadrant-nuclear-industries proposed.'
