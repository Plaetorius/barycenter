company: arc-clean-technology
name: ARC Clean Technology Inc.
sector: fission
notes: >-
  Developer of the ARC-100 sodium-cooled fast reactor. Only the Series B (closed 2025-12-16) is evidenced; the amount is
  undisclosed in the release and omitted. The release (via 24-7PressRelease, a wire republishing company text; the
  company newsroom links to it) names five participants, no lead and no per-investor amounts; it also mentions a 'corporate
  venture capital arm of a major energy company' without naming it (Banpu Ventures is the only corporate venture arm
  named). The release says ARC is an awardee of DOE Advanced Reactor Demonstration Program grant funding and works with New
  Brunswick Power (Point Lepreau) and Hatch; amounts and earlier rounds (Series A etc.), ARDP/Canadian public funding and
  the KHNP collaboration agreement were not evidenced here. The company site shows a roadmap line 'Series B Closed'.
