company: general-fusion
name: General Fusion
sector: fusion
notes: 'Sources: SEC F-4/424B3 prospectus (CIK 2074850, snapshot ea0db30c), 8-Ks, 20-F, General Fusion releases (generalfusion.com is fetchable), Canada G&C JSON, Wayback copies of 2019-2021 pages. GAPS:
  no primary source retrievable for Series A-C (2007-2018), Cenovus/Chrysalix/Bezos Expeditions early investments, SDTC and UK government support; WebSearch budget was exhausted and older release URLs not
  found. Series D 2019 rests on two press-digest stubs on the company site (reported). CONFLICTS/DOUBLE-COUNT WARNINGS: (1) Aug 2025: release says US$22M (C$31M); SEC says Rights Offering US$18.4M (incl.
  US$1.4M related-party loan settlement) plus CAD 5.0M (~US$3.6M) SIF commitment = ~US$22.0M. The SIF 2026-03-26 amendment event (CAD 5M) is the same money as the SIF part of the US$22M headline; the ledger
  counts the equity at 18.4M only. (2) SAFEs: SEC gross US$44.5M (Q4 2025 to Jan 2026) vs Globe and Mail via TechCrunch US$51.1M from ~70 investors. (3) Series F: release said US$25M combined first close
  incl. BC grant; SEC says Class F Series 1 total proceeds US$20.9M (July 2023); announced_on is the release date, closed_on approximated to month-end July 2023. (4) SIF agreement values are authorised
  maxima (Canada G&C); contributions come with warrants issued to the Crown. The cumulative event is amount_kind=cumulative and must not be summed with increments. SPAC: Spring Valley Acquisition Corp.
  III IPO (US$230M, 2025-09-05) is the SPAC''s own capital, recorded for completeness; trust was heavily redeemed (21,075,896 shares per 20-F pro forma note). The listing event has no amount: company says
  it entered public markets with approximately US$150M cash inclusive of net private placement and trust proceeds; TechCrunch/FusionX reports US$127M net. PIPE: 10,556,367 units at $10.20 = ~US$107.7M gross
  vs ''approximately US$105M'' in releases; anchor Alyeska inferred from the 20-F beneficial ownership text (8-K only says ''Anchor PIPE Investor''). Nasdaq trading began 2026-07-13 as GFUZ (closing 2026-07-10).
  Date precision: SAFE announced_on is month-start (Nov 2025); Series D 2019 year from post context. INFUSE and NSERC events carry no amounts; NSERC award is joint with SFU. No ATM programme found. BC grant
  announced_on is the Series F release date (August 2023, exact day not stated). Reviewer: check new-entity slugs (british-columbia-government, canadian-nuclear-laboratories, tobias-lutke, triumf, renexia,
  kyoto-fusioneering). VERIFIER 2026-10-05: the CA$20M CNL/BDC lead investment (Aug 2024) is the same money as the July 2024 US$15.8M secured
  convertible notes (2024 financing inflows were only the notes plus US$1.5M SIF warrants); the notes later converted into Class B Series 2
  shares in the Aug 2025 rights offering (non-cash, excluded from the US$18.4M). SPAC trust: 21,075,896 of 23,000,000 SVAC shares were redeemed,
  so the US$230M SPAC IPO is a ceiling; the residual trust cash reaching General Fusion is not stated in any snapshot (gap). The US$1B
  pro-forma equity value assumed no redemptions and was removed from valuation_post_usd. INFUSE vouchers fund the national lab (SRNL), not
  General Fusion. SIF: CAD 74.3M actually received by 2026-06-02 (equal to agreement value), so SIF increments are real money; the prospectus
  elsewhere says only CAD 3.9M of the final CAD 5.0M had been funded (internal inconsistency).'
verification:
  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  "on": 2026-10-05
  note: >-
    8 corrections: CNL/BDC CA$20M (2024) marked duplicate of the July 2024 US$15.8M convertible notes; Spring Valley III US$230M IPO set to
    ceiling (92% of trust redeemed, SPAC's own capital); valuation_post_usd US$1B removed from SPAC listing (pro forma assuming no
    redemptions); PIPE participant Alyeska downgraded lead -> participant (8-K names only an unnamed "Anchor PIPE Investor"; Alyeska holds
    7.84M of 10.56M PIPE units, so anchor is likely but inferred) with PIPE-warrant quote added; Series E participants Jeff Bezos, Tobias
    Lutke, Kam Ghaffarian removed (named as existing individual investors, not as Series E participants); 2019 round_label "Series D"
    replaced (quote says only "latest round"); SIF cumulative event got the "received CAD 74.3M" evidence; notes on INFUSE recipient.
    Not confirmed: 2019 US$65M (press digest only; POWER says ">$100 million", probably CAD or incl. other money); net SPAC trust cash to
    GF; SAFE US$44.5M (SEC) vs US$51.1M (Globe via TechCrunch); PIPE ~US$105M vs 10,556,367 x $10.20 = US$107.7M; Series A-C missing.
