notes: >
  Funding evidence is trade-press only, via the company's own library page (f.energy/library, snapshot 1c57c88e), which
  lists third-party items with one-line summaries; the Ignition (typeform redirect) and Forbes/Bloomberg origins could
  not be read (Ignition snapshot is a typeform stub; Forbes 403; Bloomberg is a paywall stub with only the headline).
  So all amounts are basis=reported, from library blurbs. Sep 2024 round: $32M, valuation "over $200 million" per
  Bloomberg headline (stored as floor 200M). No investor names found. Cumulative figures ($20M Jul 2024 Forbes, $52M
  Apr 2025 EO video blurb) are recorded as cumulative, not rounds; $20M + $32M = $52M, so the cumulative figures are
  consistent with the Sep 2024 round being new money on top of the earlier $20M; do not sum cumulative rows. Also, a Bloomberg item dated Aug 2026 ("Investors Bet on
  Making Commercial Fusion a Reality") may relate to a newer round; not evidenced. The $151B Golden Dome SHIELD IDIQ is a
  multiple-award ceiling for the program, awarded to subsidiary Fuse Federal Enterprise LLC; not Fuse funding and no
  value recorded. Legal entity names vary: Fuse Energy Technologies Corp / Fuse Corporation / Fuse Federal Enterprise.
  Verifier: the Bloomberg valuation item's URL is dated 2024-09-12 (the library lists it as Dec 2024), i.e. the same week as
  the Ignition $32M report, so linking the "over $200 million" valuation (a floor, stored as 200M) to the Sep 2024 round is
  plausible but rests on a headline only; announced_on stays at the Ignition item date (2024-09-16), the first report of the
  $32M figure is possibly 2024-09-12. Removed a duplicate valuation on the Apr 2025 cumulative row (no valuation evidence).
