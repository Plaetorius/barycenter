name: Jimmy Energy
sector: fission
notes: 'Jimmy Energy SAS (Aix-en-Provence; Annuaire SIREN 892884099). Sources: NucNet 2026-03-11 and Bloomberg 2026-03-10,
  both relaying the company statement of 2026-03-10; the company website (jimmy-energy.com) does not resolve from the archive
  tool and no company release was reachable, so basis is "reported". Bloomberg gives the total as EUR80M (USD93M) with half
  from the French government (so the grant and equity events are the two halves, not additive to EUR160M). Whether the France
  2030 "Phase Two" EUR40M is a grant, subsidy or conditional advance is not stated; recorded as grant, flag for review. Earlier
  rounds (before 2026) were not found in the sources reached (WebSearch budget exhausted); census lists lifetime funding as
  undisclosed. Calogena (a different company) appears in the same articles; its figures are not recorded here. Canada G&C,
  CORDIS (no Jimmy record), TED and BODACC (name search noisy, SIREN not queried) probes yielded nothing for Jimmy.

  [pass2] Pass 2 gap-fill with company primary sources from jimmy-energy.eu (the correct domain; jimmyenergy.com and jimmy-energy.com
  do not serve the site). Added the pre-2026 history: EUR 2.2M first round, EUR 15M round (EREN Industries, Noria, Otium Capital,
  Polytechnique Ventures and new entrants named, no individual amounts), EUR 32M France 2030 phase 1 (2023-11-27), ADEME Investissement
  as participant of the 2026 EUR 40M round (the 2026 release says the round is led by the ''Révolution Environnementale et
  Solidaire'' fund managed by Crédit Mutuel Impact with ADEME Investissement and historical shareholders; the existing event
  already names Crédit Mutuel Alliance Fédérale). CONFLICTS: (1) the 2023-11-27 release says ''deux premières levées de fonds
  privés de 2,2M€ puis 17M€'' while the June 2023 page says EUR 15M: both recorded as stated, the EUR 15M is kept as the round
  and EUR 17M is not added (likely 15M plus an extension, unproven). (2) The jimmy-energy.eu page header dates are unreliable:
  the page ''jimmy-leve-15meu'' is dated 2023-06-28 but says the EUR 2.2M first round was ''en début d''année''; Wikipedia
  (fr) dates the EUR 2.2M to Feb 2022 and the EUR 15M to Oct 2022 citing Les Echos (403 to archive tool, not usable), and
  another page (jimmy-laureat-de-french-tech-2030) is dated 2023-02-14 although it cites the Nov 2023 EUR 32M. The ledger
  therefore uses the page date 2023-06-28 for both rounds as the source date; true closing dates are probably 2022. The March
  2026 release totals: EUR 40M round raises private funds raised since 2020 to over EUR 60M, State support to over EUR 130M
  with phase 1 EUR 32M, matching the events here. The 2026 France 2030 phase 2 EUR 40M instrument (grant vs advance) is still
  unstated. EDGAR Form D probe: 0 hits. Agreements added: Photonis/ARCYS (2023), Toyo Tanso graphite (2024), Urenco LEU+ (2024),
  Cristal Union/Cristanol first-site plan (reported by creusot-infos, loi). Bpifrance big media page and Les Echos articles
  returned HTTP 403.'
