company: focused-energy
name: Focused Energy
sector: fusion
notes: >-
  Series A (USD 240M, announced 2026-05-27, completed 2026-07-02 with Lowercarbon) is evidenced from the company
  releases (German release of 2026-05-27; Lowercarbon release 2026-07-02) plus TechCrunch (reported). No amounts per
  investor are disclosed. TechCrunch calls RWE "the main investor"; the company release calls Prime Movers Lab the
  "bisherige Lead-Investor" (existing lead investor); roles are therefore recorded as participant, not lead.
  GAPS: the 2023 seed round (listed on the company homepage milestones) has no amount or exact date in any
  archivable source found, so no seed event is written. The company's English announcement page and the RWE release
  were not found (RWE URL guess 404). WebSearch budget was exhausted, so SPRIND, EIC Fund and Hesse (MBG) amounts
  inside the Series A are unknown. Pre-2026 German federal grants (BMBF) are not evidenced (Foerderkatalog blocked
  per probe). TechCrunch says the company "has also received $200 million in grants" (not itemised, not recorded as an
  event). The RWE Biblis site arrangement is mentioned (RWE "ermoeglicht die Nutzung des Standorts Biblis") but the
  binding level of the agreement is not stated, so no site agreement is recorded. USAspending: Milestone award
  DESC0024883 (7.5M obligated; DOE does not publish a per-company amount in its press release). The EIC EUROPA
  grant (101257418) is a consortium project; only Focused Energy's own net EU contribution is recorded.
  VERIFIER (2026-10-05): Milestone award DESC0024883 recipient is FOCUSED ENERGY INC (US subsidiary of Focused Energy GmbH);
  announced_on changed from period start (2024-06-05) to date_signed (2024-06-03); Focused was among the 8 Milestone selectees
  announced 2023-05-31. The BMFTR hub event is a 'planned' federal funding decision with no amount (not counted). Biblis plans of
  EUR200M/EUR500M private investment are company capex, not funding.
