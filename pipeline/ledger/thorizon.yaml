verification:
  status: verified
  by: "verifier-agent (claude-opus-5-5), 2026-10-05"
  'on': 2026-10-05
  note: >-
    2 corrections. JTF Project ZILT EUR10M (six-partner consortium incl. EPZ, Schelde Exotech, Delmeco, HZ, Scalda) and
    MOOI Kernenergie EUR4M (five partners incl. TU Delft, TNO, NRG PALLAS, VDL) are consortium totals with Thorizon's share
    unstated: qualifier exact -> up_to and amount_kind new_money -> ceiling (visible, not counted as Thorizon money). The
    Noord-Brabant EUR4M (consortium with VDL, Demcon) is kept as new_money because the company counts it in its 'Secures
    EUR20M' headline (EUR16M Series A tranche + EUR4M grant); its Thorizon share is likewise not stated. The France 2030
    EUR10M is dated by the 2025-03-12 release that mentions it (award was 'in 2024'; date is a placeholder, not the award
    date). EUR42.5M cumulative is not an event (author's choice; consistent with EUR20M + EUR10M + unstated first equity
    round). Gap: first equity round (Invest-NL 2022), later Series A tranches.
