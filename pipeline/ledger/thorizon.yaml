company: thorizon
name: Thorizon
sector: fission
notes: >-
  Thorizon B.V. / Thorizon Holding BV (Amsterdam; French subsidiary in Lyon). Company states EUR42.5M raised to date
  including its first equity round (cumulative, not a round; ledger events below are NOT meant to sum to it). The first
  equity round (Invest-NL "initial investment in 2022") has no amount or date in any source reached and is not recorded as
  an event; the 2025 release implies roughly EUR12.5M by subtraction but that is not stated, so it was not entered.
  announced_on of the France 2030 EUR10M grant and the Noord-Brabant EUR4M grant is the date of the 2025-03-12 release
  that mentions them (France 2030 award is described as "in 2024"); the true award dates were not found. The Series A is
  described as only halfway done at the first tranche (EUR16M); no later tranche found. Grants JTF EUR10M (ZILT) and MOOI
  EUR4M are to consortia led by or including Thorizon; the Thorizon share of each is not stated. CORDIS: MIMOSA (101061142)
  EUR113,653.75 to Thorizon Holding BV; ENDURANCE (101165896) lists Thorizon as associated partner without an EC
  contribution. Canada G&C, TED and BODACC probes have no Thorizon records. Reuters/Sifted pieces not used.
