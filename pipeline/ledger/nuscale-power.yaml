  note: 'USAspending merge: all 5 supplement awards (DE-NE0000633, 0008369, 0008742, 0008820, 0008928) are already in the
    ledger by FAIN with the same obligations: 0 events added. Outlays attached as disbursed_usd for 0008928 (207.67M), 0008820
    (11.50M) and 0008369 (1.32M); not set for 0000633 and 0008742 where USAspending shows 0.0 outlays against full obligations
    (missing outlay reporting for older awards, not zero payment). Previous sign-off: verifier-agent (claude-opus-5-5), 2026-10-05:
    9 corrections: 6 ATM programme events re-kinded new_money -> ceiling (programme maximums, $3.35B of ceilings were being
    counted as money raised); CFPP DE-NE0008935 event removed (recipient CFPP LLC/UAMPS, not NuScale; facts kept in notes);
    2 realised-proceeds events added per VERIFY rule 6 (FY2025 ATM gross $1,327.6M from 10-K; Feb 2026 $1B programme fully
    sold per Aug 2026 424B5, approx). SPAC IPO/PIPE duplicates and the DOE cumulative 10-K statement are correctly uncounted;
    USAspending DOE awards to NUSCALE POWER LLC match their JSON. Not confirmed: realised ATM proceeds for 2023-2024 and for
    the Aug 2026 programme; pre-SPAC private rounds; DOE press announcements (404).

    [pass2 verify 2026-10-05, claude-opus-5-5] 3 pending items verified. 3 ATM realised-sales events (FY2023 $10.4M, FY2024
    $139.0M prior programme, FY2024 $71.2M Nov 2024 programme) verified against the FY2023/FY2024 10-K text; 10.4 + 139.0
    = 149.4 fits the $150M programme; no overlap with the FY2025 sales event or with the ceiling programme events. No changes.'
